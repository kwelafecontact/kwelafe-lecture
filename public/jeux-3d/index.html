<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Jeux péi Kwélafé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE : joyeuse, familiale, fière de l'île
   IDEA : une affiche de kermesse péi, chaque jeu est une carte de stand
   PICTURE : bandeau lagon/volcan avec paille-en-queue, cartes illustrées
   COLOUR and TYPE : bleu nuit, jaune soleil, rouge flamboyant, vert canne ; Baloo 2 + Nunito
   LAYOUT : bandeau plein écran, grille de cartes qui passe en une colonne sur téléphone */
:root{color-scheme:light dark;--bg:light-dark(#fff8ea,#0d1a3a);--ink:light-dark(#1b1a2e,#fff8ea);--carte:light-dark(#ffffff,#16285a);--doux:light-dark(#6a5d48,#c9c2b0);--jaune:#ffc928;--rouge:#e8402a;--vert:#2fa84f;--bleu:#1f6fd1;--nuit:#10204a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.bandeau{position:relative;overflow:hidden;background:linear-gradient(180deg,#59b7ef 0%,#9fd8f5 55%,#1f8fc4 56%,#0e6f9e 100%);color:#fff;padding:max(28px,env(safe-area-inset-top)) max(5vw,20px) 36px;min-height:300px}
.bandeau svg.decor{position:absolute;inset:auto 0 0 0;width:100%;height:72%;pointer-events:none}
.bandeau .texte{position:relative;max-width:1240px;margin:0 auto}
.logo{font:800 20px 'Baloo 2',sans-serif;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo i{font-style:normal}.logo i:nth-child(1){color:#1f4fbf}.logo i:nth-child(2){color:var(--jaune)}.logo i:nth-child(3){color:var(--rouge)}.logo i:nth-child(4){color:#2a9a48}
h1{font:800 clamp(34px,7vw,56px)/1.02 'Baloo 2',sans-serif;margin:10px 0 8px;text-wrap:balance;text-shadow:0 3px 14px rgba(16,32,74,.35)}
.bandeau p{margin:0;max-width:540px;font-weight:700;font-size:17px;text-shadow:0 2px 8px rgba(16,32,74,.4)}
.grille{max-width:1240px;margin:0 auto;padding:28px max(5vw,16px) 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px}
.jeu{display:flex;flex-direction:column;background:var(--carte);border-radius:24px;text-decoration:none;color:inherit;overflow:hidden;box-shadow:0 10px 26px rgba(16,32,74,.14);transition:transform .15s,box-shadow .15s;min-height:44px}
.jeu:hover,.jeu:focus-visible{transform:translateY(-4px);box-shadow:0 16px 34px rgba(16,32,74,.22);outline:none}
.jeu:focus-visible{outline:3px solid var(--jaune);outline-offset:3px}
.illu{height:150px;display:block}
.illu svg{width:100%;height:100%;display:block}
.corps{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.jeu h2{margin:0;font:800 23px/1.1 'Baloo 2',sans-serif}
.inspi{font-size:13px;font-weight:800;color:var(--rouge)}
.jeu p{margin:2px 0 0;color:var(--doux);font-size:15px}
.jouer{margin-top:auto;padding-top:10px;font:800 15px 'Baloo 2',sans-serif;color:var(--bleu)}
@media (prefers-color-scheme:dark){.jouer{color:#7fb8ff}}
:root[data-theme=dark] .jouer{color:#7fb8ff}
.lien{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));font:800 13.5px Nunito,sans-serif;color:#fff6dc;text-decoration:none;padding:9px 20px;border-radius:999px;background:linear-gradient(90deg,rgba(60,14,0,.88),rgba(110,30,0,.88),rgba(60,14,0,.88));border:1.5px solid #ffb347;box-shadow:0 0 10px #ff7a00,0 0 22px rgba(255,90,0,.55);animation:flamme 1.6s ease-in-out infinite alternate;white-space:nowrap}
@keyframes flamme{to{box-shadow:0 0 14px #ffb300,0 0 32px rgba(255,60,0,.7)}}
.note{max-width:1240px;margin:-90px auto 0;padding:0 max(5vw,16px) 110px;color:var(--doux);font-size:14px}
</style>
</head>
<body>
<header class="bandeau">
  <svg class="decor" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

      <path d="M0 10 q30 -26 60 0 q-30 -8 -60 0Z" fill="#fff"/><path d="M60 10 q30 -26 60 0 q-30 -8 -60 0Z" fill="#fff"/>

      <path d="M46 14 q-40 18 -90 30" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M46 12 q-40 22 -86 38" stroke="#fff" stroke-width="2.5" fill="none"/>
    </g>
    <g transform="translate(1040 112)"><path d="M0 70 q6 -40 22 -70" stroke="#7a5a3a" stroke-width="7" fill="none"/>
      <path d="M22 0 q-30 -6 -48 14 M22 0 q-26 10 -34 34 M22 0 q30 -10 48 8 M22 0 q24 10 30 34 M22 0 q4 -20 -6 -34" stroke="#3f8a35" stroke-width="7" fill="none" stroke-linecap="round"/></g>
  </svg>
  <div class="texte">
    <div class="logo"><i>Kw</i><i>él</i><i>a</i><i>fé</i> Production</div>
    <h1>Jeux péi</h1>
    <p>Dix jeux en 3D pour jouer à La Réunion : sur iPhone, iPad et ordinateur.</p>
  </div>
</header>

<main class="grille" id="grille"></main>
<a class="lien" href="https://kwelafeproduction.com" target="_blank" rel="noopener">kwelafeproduction.com</a>
