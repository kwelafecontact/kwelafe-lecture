  .pop.pts { font-size:clamp(28px, 6vw, 40px); color:#fff; text-shadow:0 0 12px currentColor, 0 3px 0 rgba(0,0,0,.5); }

  @keyframes feu { from { box-shadow:0 0 10px 2px #ff8a1e, 0 0 24px 6px rgba(255,80,0,.45); } to { box-shadow:0 0 16px 4px #ffc23a, 0 0 42px 12px rgba(255,120,0,.65); } }

<script type="module">
import * as THREE from 'three';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const PARAMS = new URLSearchParams(location.search), TEST = PARAMS.has('test');
const PETIT = Math.min(innerWidth, innerHeight) < 500 || /iPhone/.test(navigator.userAgent);

// ---------------------------------------------------------------- rendu
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: !PETIT, alpha: true, preserveDrawingBuffer: TEST });
renderer.setPixelRatio(Math.min(devicePixelRatio, PETIT ? 1.75 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100); camera.position.set(0, 0, 14);
scene.add(new THREE.HemisphereLight(0x8fa0ff, 0x101020, 1.4));
const lumiere = new THREE.PointLight(0xffc070, 0, 30, 1.5); lumiere.position.set(0, 0, 4); scene.add(lumiere);
let W = 0, H = 0, viewH = 10, viewW = 10;
function resize() {
  W = innerWidth; H = innerHeight; renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  viewH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z; viewW = viewH * camera.aspect;
}
addEventListener('resize', resize); resize();
const toScreen = v => { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H }; };

// ---------------------------------------------------------------- particules lumineuses (GPU, mélange additif)
const MAXP = PETIT ? 4000 : 8000;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3), pTai = new Float32Array(MAXP), pAlp = new Float32Array(MAXP);
const P = Array.from({ length: MAXP }, () => ({ vie: 0, max: 1, vx: 0, vy: 0, vz: 0, g: 1, frein: 1, t0: 1, scint: false, r: 1, gg: 1, b: 1, trainee: false }));
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('couleur', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('taille', new THREE.BufferAttribute(pTai, 1).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('alpha', new THREE.BufferAttribute(pAlp, 1).setUsage(THREE.DynamicDrawUsage));
const matP = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { echelle: { value: 1 } },
  vertexShader: `attribute vec3 couleur; attribute float taille; attribute float alpha; varying vec3 vC; varying float vA; uniform float echelle;
    void main() { vC = couleur; vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = taille * echelle / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main() { vec2 d = gl_PointCoord - 0.5; float r = length(d); if (r > 0.5) discard;
    float coeur = exp(-r * r * 70.0), halo = exp(-r * r * 14.0); gl_FragColor = vec4(vC * (halo * 0.5 + coeur * 1.4) + vec3(coeur * 0.35), vA * (halo * 0.8 + coeur)); }`
});
const points = new THREE.Points(geo, matP); points.frustumCulled = false; scene.add(points);
let pIdx = 0;
function etincelle(x, y, z, vx, vy, vz, c, vie, taille, opts = {}) {
  const p = P[pIdx]; const i = pIdx; pIdx = (pIdx + 1) % MAXP;
  p.vie = p.max = vie; p.vx = vx; p.vy = vy; p.vz = vz; p.g = opts.g ?? 1.6; p.frein = opts.frein ?? 0.985; p.t0 = taille; p.scint = !!opts.scint; p.trainee = !!opts.trainee;
  p.r = c.r; p.gg = c.g; p.b = c.b;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
}
function majParticules(dt) {
  for (let i = 0; i < MAXP; i++) {
    const p = P[i];
    if (p.vie <= 0) { pAlp[i] = 0; continue; }
    p.vie -= dt;
    const f = Math.pow(p.frein, dt * 60);
    p.vx *= f; p.vy = p.vy * f - p.g * dt; p.vz *= f;
    pPos[i * 3] += p.vx * dt; pPos[i * 3 + 1] += p.vy * dt; pPos[i * 3 + 2] += p.vz * dt;
    const k = Math.max(0, p.vie / p.max);
    let a = Math.min(1, k * 1.6);
    if (p.scint) a *= 0.45 + 0.55 * (Math.sin((p.vie * 40) + i) > 0 ? 1 : 0.2);
    pAlp[i] = a; pTai[i] = p.t0 * (0.5 + 0.5 * k);
    const chaud = Math.max(0, k - 0.75) * 3; // les éclats démarrent presque blancs
    pCol[i * 3] = p.r + (1 - p.r) * chaud; pCol[i * 3 + 1] = p.gg + (1 - p.gg) * chaud; pCol[i * 3 + 2] = p.b + (1 - p.b) * chaud;
    if (p.trainee && Math.random() < 0.25) {
      const j = pIdx; etincelle(pPos[i * 3], pPos[i * 3 + 1], pPos[i * 3 + 2], 0, 0, 0, tmpC.setRGB(p.r * .6, p.gg * .5, p.b * .4), 0.5, p.t0 * 0.5, { g: 0.4 }); P[j].trainee = false;
    }
  }
  for (const n of ['position', 'couleur', 'taille', 'alpha']) geo.attributes[n].needsUpdate = true;
}
const tmpC = new THREE.Color();

// ---------------------------------------------------------------- sons (synthétisés, aucune voix)
let actx = null, maitre = null, sonCoupe = false;
try { sonCoupe = localStorage.getItem('petepetard_son') === 'non'; } catch (e) {}
function audio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); maitre = actx.createGain(); maitre.gain.value = sonCoupe ? 0 : 0.7; maitre.connect(actx.destination); } catch (e) {}
}
function bruit(dur, f, q, vol, when = 0, type = 'lowpass') {
  if (!actx) return; const t = actx.currentTime + when;
  const b = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
  const s = actx.createBufferSource(); s.buffer = b; const fi = actx.createBiquadFilter(); fi.type = type; fi.frequency.value = f; fi.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fi).connect(g).connect(maitre); s.start(t);
}
function ton(f0, f1, dur, vol, type = 'sine', when = 0) {
  if (!actx) return; const t = actx.currentTime + when; const o = actx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(maitre); o.start(t); o.stop(t + dur + 0.05);
}
const son = {
  sifflet: () => ton(rnd(500, 700), rnd(1600, 2400), rnd(0.6, 0.9), 0.035, 'sine'),
  boum: (gros = 1) => { bruit(0.9 * gros, 600, 0.7, 0.9 * gros); bruit(0.25, 2400, 1, 0.25); },
  pet: () => { bruit(0.12, 3000, 2, 0.5, 0, 'bandpass'); bruit(0.18, 900, 1, 0.5, 0.05); },
  crepite: () => { for (let i = 0; i < 10; i++) bruit(0.03, rnd(3000, 6000), 4, 0.12, 0.25 + i * rnd(0.03, 0.08), 'bandpass'); },
  fumee: () => { bruit(0.8, 300, 0.5, 0.5); ton(180, 70, 0.5, 0.15, 'sawtooth'); },
  rate: () => ton(420, 180, 0.35, 0.08, 'triangle'),
  chaine: n => { [0, 4, 7, 12, 16].slice(0, Math.min(5, n)).forEach((st, i) => ton(523 * 2 ** (st / 12), 523 * 2 ** (st / 12), 0.2, 0.06, 'triangle', i * 0.06)); },
};

// ---------------------------------------------------------------- fusées, pétards, bombes de fumée
const PALETTES = [
  ['#2f6fff', '#ffe23a', '#ff3030', '#2fd04a'],       // drapeau réunionnais (lo mahavéli)
  ['#ff4fb4', '#ffd0f0'], ['#ffd24a', '#fff4c0'], ['#2fe0ff', '#c8f8ff'], ['#ff6a1a', '#ffd24a'], ['#b45cff', '#ffffff'], ['#5fe04a', '#e8ffc0'], ['#ff3030', '#ffffff'],
].map(p => p.map(c => new THREE.Color(c)));
function corpsFusee(couleur, long = 1) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: couleur, roughness: 0.5, metalness: 0.1 });
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.75 * long, 14), mat);
  const bande = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.12, 14), new THREE.MeshStandardMaterial({ color: 0xfff4dc, roughness: 0.6 }));
  bande.position.y = 0.12 * long;
  const nez = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.32, 14), new THREE.MeshStandardMaterial({ color: 0xf2e8d0, roughness: 0.5 }));
  nez.position.y = 0.375 * long + 0.16;
  const baguette = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.0, 6), new THREE.MeshStandardMaterial({ color: 0xc8a060 }));
  baguette.position.set(0.15, -0.6 * long, 0);
  g.add(tube, bande, nez, baguette); return g;
}
function corpsPetard() {
  const g = new THREE.Group();
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.55, 16), new THREE.MeshStandardMaterial({ color: 0xd8141e, roughness: 0.45 }));
  const fil = new THREE.Mesh(new THREE.CylinderGeometry(0.205, 0.205, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0xffc83a, metalness: 0.6, roughness: 0.3 }));
  const meche = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.25, 6), new THREE.MeshStandardMaterial({ color: 0x3a2a1a }));
  meche.position.y = 0.38; g.add(tube, fil, meche); return g;
}
const matFumee = new THREE.MeshStandardMaterial({ color: 0x55555e, roughness: 0.9 });
function corpsBombe() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 14), matFumee));
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 6), new THREE.MeshStandardMaterial({ color: 0x2a2a2a })); m.position.y = 0.4; g.add(m);
  return g;
}
const matOr = new THREE.MeshStandardMaterial({ color: 0xffc83a, metalness: 1, roughness: 0.2, emissive: 0x6a4200, emissiveIntensity: 0.6 });

const engins = [];
let etat = 'menu', mode = 'classique', score = 0, vies = 3, temps = 0, prochain = 1, record = 0, chaineN = 0, chaineT = 0, chainePos = null, finale = 0;
const DUREE_ZEN = 90;
function lancer(type) {
  let obj, rayon = 0.75;
  const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
  if (type === 'fusee') obj = corpsFusee(pal[0], rnd(0.9, 1.15));
  else if (type === 'doree') { obj = corpsFusee(0xffc83a, 1.2); obj.traverse(m => { if (m.isMesh) m.material = matOr; }); rayon = 0.9; }
  else if (type === 'petard') { obj = corpsPetard(); rayon = 0.7; }
  else { obj = corpsBombe(); rayon = 0.65; }
  const x0 = rnd(-viewW * 0.4, viewW * 0.4), y0 = -viewH / 2 - 1;
  const niveau = Math.min(10, temps / 12);
  const sommet = rnd(viewH * 0.12, viewH * 0.42);
  const g = type === 'petard' ? 5.5 : 4.2;
  const vy = Math.sqrt(2 * g * (sommet - y0)) * (1 + niveau * 0.02);
  const vx = rnd(-0.8, 0.8) - x0 * 0.06;
  obj.position.set(x0, y0, rnd(-0.5, 0.5));
  scene.add(obj);
  const e = { type, obj, vx, vy, g, rayon, pal, vivant: true, vrot: type === 'petard' ? rnd(-3, 3) : 0, t: 0 };
  engins.push(e);
  if (type !== 'bombe') son.sifflet();
  return e;
}
function vague() {
  const niveau = Math.min(10, temps / 12);
  const n = 1 + Math.floor(Math.random() * Math.min(1 + niveau * 0.45, 5));
  for (let i = 0; i < n; i++) setTimeout(() => {
    if (etat !== 'jeu') return;
    const r = Math.random(), pB = temps < 8 ? 0 : Math.min(0.1 + niveau * 0.015, 0.22);
    lancer(r < pB ? 'bombe' : r < pB + 0.05 && !engins.some(e => e.vivant && e.type === 'doree') ? 'doree' : r < pB + 0.4 ? 'petard' : 'fusee');
  }, i * rnd(150, 380));
  prochain = Math.max(0.75, 2.1 - niveau * 0.13) + rnd(0, 0.5);
}

// ---------------------------------------------------------------- éclats
function eclater(e, enChaine = false) {
  if (!e.vivant) return; e.vivant = false; scene.remove(e.obj);
  const p = e.obj.position;
  if (e.type === 'bombe') {
    son.fumee();
    for (let i = 0; i < 70; i++) etincelle(p.x, p.y, p.z, rnd(-1.6, 1.6), rnd(-0.6, 1.8), rnd(-.5, .5), tmpC.setRGB(0.22, 0.22, 0.25), rnd(1.2, 2.2), rnd(160, 260), { g: -0.3, frein: 0.96 });
    popup('Pfff… fumée ! −5', p, 'aie');
    score = Math.max(0, score - 5); majScore();
    if (mode === 'classique') perdreVie();
    return;
  }
  const gros = e.type === 'doree' ? 1.8 : e.type === 'petard' ? 0.7 : 1;
  const forme = e.type === 'petard' ? 'petard' : ['sphere', 'anneau', 'palmier', 'saule', 'coeur'][Math.floor(Math.random() * 5)];
  feu(p.x, p.y, p.z, e.type === 'doree' ? [new THREE.Color('#ffd24a'), new THREE.Color('#fff4c0'), new THREE.Color('#ff9a1f')] : e.pal, forme, gros);
  if (e.type === 'petard') son.pet(); else { son.boum(gros); son.crepite(); }
  lumiere.color.copy(e.pal[0]); lumiere.intensity = 60 * gros; lumiere.position.set(p.x, p.y, 4);
  lueur(e.pal[0], gros);
  // chaîne : chaque éclat dans le geste ou la réaction augmente le multiplicateur
  const now = performance.now();
  if (now - chaineT < 900) chaineN++; else chaineN = 1;
  chaineT = now; chainePos = p.clone();
  const mult = Math.min(8, chaineN);
  const base = e.type === 'doree' ? 10 : e.type === 'petard' ? 3 : 2;
  const pts = base * mult;
  if (etat === 'jeu') { score += pts; majScore(); }
  popup('+' + pts, p, 'pts', '#' + e.pal[0].getHexString());
  if (e.type === 'doree') setTimeout(() => popup('Fusée dorée !', p.clone().add(new THREE.Vector3(0, -0.9, 0)), 'chaine'), 100);
  // réaction en chaîne : les engins proches s'allument aussi (sauf les bombes)
  const portee = 1.7 * gros;
  for (const o of engins) if (o.vivant && o.type !== 'bombe' && o.obj.position.distanceTo(p) < portee) setTimeout(() => { if (o.vivant) { eclater(o, true); } }, 90);
}
function feu(x, y, z, pal, forme, gros = 1) {
  const n = Math.round((PETIT ? 110 : 170) * gros * (forme === 'petard' ? 0.5 : 1));
  const v0 = (forme === 'petard' ? 3.2 : 5.2) * Math.sqrt(gros);
  for (let i = 0; i < n; i++) {
    const c = pal[i % pal.length];
    let dx, dy, dz;
    if (forme === 'anneau') { const a = (i / n) * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); dz = rnd(-.1, .1); }
    else if (forme === 'coeur') { const a = (i / n) * Math.PI * 2; dx = 16 * Math.sin(a) ** 3 / 16; dy = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16; dz = rnd(-.1, .1); }
    else { const u = rnd(-1, 1), a = rnd(0, Math.PI * 2), s = Math.sqrt(1 - u * u); dx = s * Math.cos(a); dy = u; dz = s * Math.sin(a) * 0.6; }
    const v = v0 * (forme === 'sphere' || forme === 'anneau' || forme === 'coeur' ? rnd(0.92, 1.05) : rnd(0.4, 1));
    const saule = forme === 'saule' || forme === 'palmier';
    etincelle(x, y, z, dx * v, dy * v, dz * v, c, rnd(1.2, 1.9) * (saule ? 1.6 : 1), rnd(90, 150) * (forme === 'petard' ? 0.8 : 1),
      { g: saule ? 2.6 : 1.4, frein: saule ? 0.975 : 0.965, scint: Math.random() < 0.3, trainee: saule || Math.random() < 0.15 });
  }
  for (let i = 0; i < 18; i++) etincelle(x, y, z, rnd(-1, 1), rnd(-1, 1), 0, tmpC.setRGB(1, 0.95, 0.85), 0.18, 160 * gros, { g: 0, frein: 0.9 });
}
let lueurT = 0;
function lueur(c, gros) { const e = $('lueur'); e.style.background = `radial-gradient(circle at 50% 35%, #${c.getHexString()}88, transparent 70%)`; lueurT = 0.5 * gros; }

// ---------------------------------------------------------------- toucher et glisser
let appui = false, dernier = null;
const pointeur = e => ({ x: e.clientX, y: e.clientY });
addEventListener('pointerdown', e => { if (e.target.closest('.zone-interactive')) return; audio(); appui = true; dernier = pointeur(e); toucher(dernier, dernier); });
addEventListener('pointermove', e => { if (!appui) return; const p = pointeur(e); toucher(dernier, p); dernier = p; });
addEventListener('pointerup', () => { appui = false; }); addEventListener('pointercancel', () => { appui = false; });
function toucher(a, b) {
  if (etat !== 'jeu') return;
  for (const e of engins) {
    if (!e.vivant) continue;
    const s = toScreen(e.obj.position), r = e.rayon * H / viewH + 18;
    const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
    const t = L ? Math.max(0, Math.min(1, ((s.x - a.x) * dx + (s.y - a.y) * dy) / L)) : 0;
    const px = a.x + t * dx - s.x, py = a.y + t * dy - s.y;
    if (px * px + py * py < r * r) eclater(e);
  }
}
function popup(txt, pos, cls, couleur) {
  const s = toScreen(pos), e = document.createElement('div'); e.className = 'pop ' + cls; e.textContent = txt;
  if (couleur) e.style.color = couleur;
  e.style.left = Math.min(Math.max(s.x, 110), W - 110) + 'px'; e.style.top = Math.min(Math.max(s.y, 140), H - 160) + 'px';
  document.body.appendChild(e); setTimeout(() => e.remove(), 1400);
}

// ---------------------------------------------------------------- partie
function majScore() { const e = $('score'); e.textContent = score; e.classList.remove('saute'); void e.offsetWidth; e.classList.add('saute'); $('meilleurHud').textContent = 'Record : ' + Math.max(record, score); }
function majVies() {
  if (mode === 'zen') { $('vies').innerHTML = `<div class="temps">${Math.max(0, Math.ceil(DUREE_ZEN - temps))} s</div>`; return; }
  $('vies').innerHTML = [0, 1, 2].map(i => `<span class="${i >= vies ? 'perdue' : ''}">🎆</span>`).join('');
}
function perdreVie() { if (etat !== 'jeu') return; vies = Math.max(0, vies - 1); majVies(); if (vies === 0) finPartie(); }
function demarrer(m) {
  audio(); mode = m; etat = 'jeu'; score = 0; vies = 3; temps = 0; prochain = 0.8; chaineN = 0;
  try { record = +localStorage.getItem('petepetard_record_' + mode) || 0; } catch (e) {}
  for (const e of engins) if (e.vivant) { e.vivant = false; scene.remove(e.obj); }
  majScore(); majVies();
  $('menu').classList.add('cache'); $('fin').classList.add('cache'); $('hud').classList.add('on'); $('lien').classList.add('discret');
}
function finPartie() {
  etat = 'fin';
  const nouveau = score > record && score > 0;
  if (nouveau) { record = score; try { localStorage.setItem('petepetard_record_' + mode, record); } catch (e) {} finale = 5; }
  $('scoreFin').textContent = score; $('recordFin').textContent = (mode === 'zen' ? 'Record Zen : ' : 'Record : ') + record;
  $('nouveauRecord').textContent = nouveau ? 'Nouveau record ! Feu d\'artifice !' : '';
  const et = score >= 600 ? 3 : score >= 250 ? 2 : score >= 60 ? 1 : 0;
  $('etoilesFin').innerHTML = [0, 1, 2].map(i => `<span class="${i < et ? '' : 'vide'}">★</span>`).join('');
  setTimeout(() => { if (etat !== 'fin') return; $('fin').classList.remove('cache'); $('hud').classList.remove('on'); $('lien').classList.remove('discret'); }, 900);
}

// ---------------------------------------------------------------- boucle
const horloge = new THREE.Clock();
let ambiance = 2;
function boucle() {
  const dt = Math.min(horloge.getDelta(), 0.05);
  matP.uniforms.echelle.value = H * renderer.getPixelRatio() / viewH * 0.032;
  if (etat === 'jeu') {
    temps += dt; prochain -= dt; if (prochain <= 0) vague();
    if (mode === 'zen') { majVies(); if (temps >= DUREE_ZEN) finPartie(); }
  } else {
    // au menu : quelques fusées lointaines pour l'ambiance
    ambiance -= dt; if (ambiance <= 0) { ambiance = rnd(0.9, 2.2); const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)]; feu(rnd(-viewW * .4, viewW * .4), rnd(0, viewH * .35), -6, pal, ['sphere', 'anneau', 'saule'][Math.floor(Math.random() * 3)], 0.8); if (actx && etat === 'fin') son.boum(0.4); }
  }
  if (finale > 0) {
    finale -= dt;
    if (Math.random() < 0.18) { const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)]; feu(rnd(-viewW * .45, viewW * .45), rnd(-viewH * .05, viewH * .4), rnd(-3, 0), pal, ['sphere', 'anneau', 'palmier', 'saule', 'coeur'][Math.floor(Math.random() * 5)], rnd(0.8, 1.4)); son.boum(0.6); }
  }
  for (let i = engins.length - 1; i >= 0; i--) {
    const e = engins[i];
    if (!e.vivant) { engins.splice(i, 1); continue; }
    e.t += dt; e.vy -= e.g * dt;
    e.obj.position.x += e.vx * dt; e.obj.position.y += e.vy * dt;
    if (e.type === 'petard') { e.obj.rotation.z += e.vrot * dt; e.obj.position.x += Math.sin(e.t * 9) * 0.02; }
    else if (e.type !== 'bombe') e.obj.rotation.z = -Math.atan2(e.vx, Math.max(0.5, e.vy)) * 0.8;
    const p = e.obj.position, bas = new THREE.Vector3(0, -0.5, 0).applyEuler(e.obj.rotation).add(p);
    if (e.type === 'bombe') { if (Math.random() < 0.6) etincelle(p.x, p.y + 0.35, p.z, rnd(-.3, .3), rnd(.2, .6), 0, tmpC.setRGB(0.3, 0.3, 0.33), 0.9, 120, { g: -0.2, frein: 0.95 }); }
    else for (let k = 0; k < 2; k++) etincelle(bas.x, bas.y, bas.z, rnd(-.4, .4), rnd(-1.6, -0.6), 0, tmpC.setRGB(1, rnd(0.5, 0.8), 0.25), rnd(0.25, 0.5), rnd(40, 70), { g: 1, scint: true });
    // une fusée qui arrive au sommet sans être touchée fait « pschitt »
    if (e.vy <= 0) {
      e.vivant = false; scene.remove(e.obj);
      if (e.type !== 'bombe' && etat === 'jeu') {
        for (let k = 0; k < 14; k++) etincelle(p.x, p.y, p.z, rnd(-.6, .6), rnd(-.3, .5), 0, tmpC.setRGB(.6, .5, .4), 0.6, 60, { g: 1 });
        son.rate(); popup('Pschitt !', p, 'aie');
        if (mode === 'classique' && e.type !== 'doree') perdreVie();
      }
    }
  }
  if (chaineN >= 3 && performance.now() - chaineT > 900) {
    const bonus = chaineN * 5;
    if (etat === 'jeu') { score += bonus; majScore(); }
    popup(`Chaîne ×${chaineN} ! +${bonus}`, chainePos || new THREE.Vector3(), 'chaine'); son.chaine(chaineN); chaineN = 0;
  } else if (performance.now() - chaineT > 900) chaineN = 0;
  majParticules(dt);
  lumiere.intensity *= Math.pow(0.02, dt);
  if (lueurT > 0) { lueurT -= dt; } $('lueur').style.opacity = Math.max(0, lueurT) * 0.9;
  renderer.render(scene, camera);
  requestAnimationFrame(boucle);
}

// ---------------------------------------------------------------- boutons
const majSon = () => { $('btnSon').textContent = sonCoupe ? '🔇' : '🔊'; };
majSon();
$('btnSon').onclick = () => { sonCoupe = !sonCoupe; try { localStorage.setItem('petepetard_son', sonCoupe ? 'non' : 'oui'); } catch (e) {} if (maitre) maitre.gain.value = sonCoupe ? 0 : 0.7; majSon(); };
$('jouer').onclick = () => demarrer('classique');
$('jouerZen').onclick = () => demarrer('zen');
$('rejouer').onclick = () => demarrer(mode);
$('menuFin').onclick = () => { finale = 0; etat = 'menu'; $('fin').classList.add('cache'); $('menu').classList.remove('cache'); };
$('retour').onclick = () => { try { if (window.top !== window && window.top.location.origin === location.origin) { window.top.location.href = '/jeux'; return; } } catch (e) {} location.href = '/jeux'; };
document.querySelectorAll('.zone-interactive').forEach(element => { element.addEventListener('touchend', function (event) { event.preventDefault(); event.stopPropagation(); if (event.currentTarget.click) event.currentTarget.click(); }, { passive: false }); });
const img = new Image(); img.src = './fond-barachois.webp'; img.onload = img.onerror = () => { $('charge').textContent = ''; window.PRET = true; };
majVies(); majScore();
requestAnimationFrame(boucle);
window.kwelafeLiberer = () => { renderer.dispose(); renderer.forceContextLoss(); if (actx) try { actx.close(); } catch (e) {} };
if (TEST) window.jeu = { engins, toScreen, get etat() { return etat; }, toucher, demarrer, finPartie };
</script>
</body>
</html>
