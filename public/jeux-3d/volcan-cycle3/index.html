<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le volcan de La Réunion · Kwélafé Éducation</title>
<style>
:root{
  --nuit:#140a07; --basalte:#2a1c17; --basalte2:#3a2820; --lave:#ff4d00; --orange:#ff8c00; --jaune:#ffd23f;
  --rouge:#b3001b; --creme:#fff1c1; --bleu:#1E5AA8; --vert:#2A9D5C; --texte:#fff6e8; --doux:#d8c3b4;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#140a07}
html,body{margin:0;min-height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--texte); background:radial-gradient(ellipse at 50% 110%,#5a1a06 0%,#2a0f07 35%,var(--nuit) 70%) fixed;
  min-height:100vh; display:flex; flex-direction:column; overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.barre{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 14px;
  padding-top:max(10px,env(safe-area-inset-top));background:rgba(20,10,7,.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,140,0,.18)}
.marque{display:flex;flex-direction:column;line-height:1.05;flex:1;min-width:0}
.marque b{font-size:15px;letter-spacing:.12em;background:linear-gradient(90deg,#4f8ff0,#ffd23f 45%,#ff5a4a 70%,#3cc27a);-webkit-background-clip:text;background-clip:text;color:transparent}
.marque span{font-size:12px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastille{display:flex;align-items:center;gap:6px;background:rgba(255,210,63,.12);border:1px solid rgba(255,210,63,.35);padding:6px 10px;border-radius:999px;font-weight:800}
.btn-ico{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px}
.btn-ico:active{transform:scale(.94)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:16px 16px 30px}
footer{text-align:center;padding:18px 12px calc(22px + env(safe-area-inset-bottom))}
.lien-feu{display:inline-block;padding:10px 20px;border-radius:999px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.04em;
  background:linear-gradient(90deg,#b3001b,#ff4d00,#ffb000,#ff4d00,#b3001b);background-size:300% 100%;animation:feu 3.5s linear infinite;
  box-shadow:0 0 14px rgba(255,90,0,.75),0 0 34px rgba(255,140,0,.45),inset 0 0 8px rgba(255,255,255,.35)}
@keyframes feu{to{background-position:300% 0}}
.signature{font-size:12px;color:var(--doux);margin-top:10px}

/* Accueil */
.hero{display:grid;grid-template-columns:1fr;gap:12px;align-items:center;text-align:center;margin-bottom:14px}
.hero h1{margin:0;font-size:clamp(28px,6vw,46px);line-height:1.05}
.hero h1 em{font-style:normal;color:var(--jaune);text-shadow:0 0 18px rgba(255,140,0,.6)}
.hero p{margin:6px 0 0;color:var(--doux)}
.volcan-accueil{width:min(420px,92%);margin:0 auto;display:block;cursor:pointer;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5))}
.volcan-accueil:active{transform:scale(.98)}
.astuce{font-size:13px;color:var(--jaune);margin-top:-4px}
.savais b{display:block}
.savais{flex-wrap:wrap;background:linear-gradient(135deg,rgba(30,90,168,.25),rgba(42,157,92,.18));border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:12px 14px;margin:10px 0 16px;display:flex;gap:10px;align-items:center;min-height:64px}
.savais b{color:var(--jaune);white-space:nowrap}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tuile{position:relative;text-align:left;padding:14px 14px 12px;border-radius:var(--r);min-height:132px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,var(--basalte2),var(--basalte));border:1px solid rgba(255,140,0,.22);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tuile:active{transform:scale(.97)}
.tuile .ico{font-size:30px}
.tuile .num{position:absolute;top:10px;right:12px;font-size:12px;color:var(--doux)}
.tuile h3{margin:0;font-size:16px;line-height:1.15}
.tuile small{color:var(--doux);font-size:12.5px;line-height:1.25}
.tuile .et{margin-top:auto;letter-spacing:2px;color:#6b5348;font-size:18px}
.tuile .et .on{color:var(--jaune);text-shadow:0 0 8px rgba(255,210,63,.7)}
.tuile.defi{background:linear-gradient(160deg,#5a1406,#2a0c06);border-color:rgba(255,210,63,.5)}
.bas-accueil{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

/* Écrans de module */
.titre-mod{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.titre-mod .ico{font-size:30px}
.titre-mod h2{margin:0;font-size:clamp(21px,4.6vw,30px);line-height:1.1}
.titre-mod p{margin:2px 0 0;color:var(--doux);font-size:14px}
.etapes{display:flex;gap:6px;margin:0 0 12px}
.etapes i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.12)}
.etapes i.on{background:linear-gradient(90deg,var(--lave),var(--jaune))}
.carte{background:rgba(42,28,23,.88);border:1px solid rgba(255,140,0,.2);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.consigne{font-size:17px;font-weight:800;margin:0 0 10px;line-height:1.3}
.consigne .cible{color:var(--jaune)}
.texte{font-size:16px;line-height:1.5;margin:0 0 10px}
.svgbox{width:100%;max-width:640px;margin:0 auto;display:block;border-radius:14px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.btn{padding:13px 18px;border-radius:14px;font-weight:800;font-size:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);min-height:48px}
.btn:active{transform:scale(.96)}
.btn.feu{background:linear-gradient(135deg,#ff4d00,#ff8c00);border-color:transparent;box-shadow:0 6px 18px rgba(255,77,0,.4)}
.btn.bleu{background:linear-gradient(135deg,#1E5AA8,#3a7bd5);border-color:transparent}
.btn.vert{background:linear-gradient(135deg,#1f7a46,#2A9D5C);border-color:transparent}
.btn[disabled]{opacity:.4;pointer-events:none}
.choix{display:grid;gap:10px}
.choix.deux{grid-template-columns:1fr 1fr}
.choix button{text-align:left;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);font-size:16px;font-weight:700;min-height:54px;line-height:1.25}
.choix button:active{transform:scale(.98)}
.choix button.juste{background:rgba(42,157,92,.35);border-color:#3cc27a}
.choix button.faux{background:rgba(179,0,27,.25);border-color:#ff6b6b}
.choix button.montre{border-color:#3cc27a;border-style:dashed}
.kwelafe{display:flex;gap:10px;align-items:flex-start;background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:10px 12px;margin:10px 0}
.kwelafe svg{flex:0 0 46px;width:46px;height:46px}
.kwelafe div{font-size:15px;line-height:1.4}
.kwelafe b{display:block;color:var(--jaune);font-size:13px;letter-spacing:.04em}
.info{min-height:86px}
.info h4{margin:0 0 4px;color:var(--jaune);font-size:18px}
.info p{margin:0;font-size:15.5px;line-height:1.45}
.cache{display:none!important}
.retour-msg{min-height:26px;font-weight:800;margin-top:8px;font-size:16px}
.retour-msg.ok{color:#5be08f}.retour-msg.ko{color:#ffb38a}
.secoue{animation:secoue .38s}
@keyframes secoue{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.08)}}

/* Frise */
.frise{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative;margin:6px 0 14px}
.frise:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:4px;border-radius:4px;background:linear-gradient(90deg,#7a4a30,var(--lave),var(--jaune))}
.creneau{min-height:96px;border-radius:12px;border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font-size:12px;line-height:1.2}
.creneau.plein{border-style:solid;border-color:var(--orange);background:rgba(255,77,0,.18)}
.creneau .an{font-size:18px;font-weight:900;color:var(--jaune)}
.etiquettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.etiq{padding:10px 12px;border-radius:12px;background:var(--creme);color:#3a1d10;font-weight:700;text-align:left;font-size:14px;line-height:1.25;min-height:70px;box-shadow:0 4px 0 #c9a46a}
.etiq b{display:block;font-size:20px;color:#b3001b}
.etiq.place{display:none}

/* Maths */
.barres{display:flex;align-items:flex-end;justify-content:space-around;height:220px;gap:12px;padding:10px 6px 0;border-bottom:3px solid rgba(255,255,255,.3)}
.barre-alt{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.barre-alt .col{width:100%;border-radius:12px 12px 0 0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);height:0;position:relative}
.barre-alt .val{font-weight:900;font-size:15px;margin-bottom:4px}
.barre-alt .nom{font-size:12.5px;text-align:center;margin-top:6px;color:var(--doux);min-height:32px}
.barre-alt button{all:unset;cursor:pointer;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.barre-alt.choisi .col{outline:3px solid var(--jaune)}
.clavier{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:10px auto 0}
.clavier button{padding:14px 0;border-radius:14px;background:rgba(255,255,255,.1);font-size:22px;font-weight:900;min-height:54px}
.clavier button.ok{background:linear-gradient(135deg,#1f7a46,#2A9D5C)}
.ecran-num{max-width:340px;margin:0 auto;text-align:center;font-size:34px;font-weight:900;padding:10px;border-radius:14px;background:rgba(0,0,0,.35);min-height:62px;letter-spacing:.06em}
.defi-cm2{display:inline-block;background:var(--jaune);color:#3a1d10;font-weight:900;font-size:12px;padding:2px 8px;border-radius:999px;margin-right:6px}

/* Alertes */
.echelle{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.niv{padding:12px 6px;border-radius:14px;font-weight:900;font-size:14px;line-height:1.15;min-height:64px;color:#fff;border:3px solid transparent;opacity:.75}
.niv.on{opacity:1;border-color:#fff;transform:translateY(-3px)}
.niv.vu:after{content:" ✓"}
.n-vig{background:#2A9D5C}.n-a1{background:#e07a00}.n-a2{background:#c1121f}.n-sau{background:#6a3fb5}
.relie{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.relie .col{display:grid;gap:8px}
.relie button{padding:12px;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);font-weight:700;min-height:54px;font-size:15px;line-height:1.2}
.relie button.sel{border-color:var(--jaune);background:rgba(255,210,63,.18)}
.relie button.fini{opacity:.45;border-color:#3cc27a;pointer-events:none}

/* Créole */
.cartes-kreol{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.flip{perspective:800px;height:120px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.tourne .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px;text-align:center}
.flip .avant{background:linear-gradient(150deg,#ff4d00,#b3001b);font-size:24px;font-weight:900}
.flip .arriere{background:var(--creme);color:#3a1d10;transform:rotateY(180deg);font-size:18px;font-weight:800}
.phrase-kreol{font-size:18px;font-weight:800;color:var(--jaune);line-height:1.45}
.trou{display:inline-block;min-width:90px;border-bottom:3px solid var(--jaune);text-align:center}
textarea{width:100%;min-height:80px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:17px;padding:10px}

/* Défi */
.score-defi{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.score-defi .sc{font-size:26px;color:var(--jaune)}
.bilan{text-align:center}
.bilan .gros{font-size:44px;font-weight:900;color:var(--jaune)}
.badge{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;background:linear-gradient(90deg,#ff4d00,#ffb000);color:#2a0c06;font-weight:900;margin:8px 0}
.mode{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);font-weight:800;white-space:nowrap}
.mode.pb{background:rgba(255,77,0,.3);border-color:var(--orange)}
.prof table{width:100%;border-collapse:collapse;font-size:14px}
.prof td,.prof th{border-bottom:1px solid rgba(255,255,255,.12);padding:7px 6px;text-align:left;vertical-align:top}
.prof th{color:var(--jaune)}
@media (min-width:760px){
  .hero{grid-template-columns:1.1fr 1fr;text-align:left}
  .grille{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:620px){ .frise{grid-template-columns:1fr;gap:6px} .frise:after{display:none} .creneau{min-height:46px;flex-direction:row;gap:10px;justify-content:flex-start;font-size:14px;text-align:left} .creneau .an{font-size:18px} }
@media (max-width:420px){ .niv{font-size:12px} }
</style>
</head>
<body>
<header class="barre">
  <button class="btn-ico cache" id="bSortie" aria-label="Retour aux jeux de l'école">‹</button>
  <button class="btn-ico" id="bAccueil" aria-label="Accueil">🏠</button>
  <div class="marque"><b>KWÉLAFÉ ÉDUCATION</b><span>Le volcan de La Réunion · Cycle 3</span></div>
  <button class="mode" id="bMode">Mi vé zoué trankil</button>
  <div class="pastille" id="hEtoiles">⭐ <span id="hScore">0</span></div>
</header>
<main id="ecran"></main>
<footer>
  <a class="lien-feu" href="https://kwelafeproduction.com" target="_blank" rel="noopener">kwelafeproduction.com</a>
  <div class="signature">Préserver aujourd'hui ce que nous voulons transmettre demain.</div>
</footer>

<script src="kwelafe-fx.js"></script>
<script>
(function(){
'use strict';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var ecran = $('#ecran');
var melange = function(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
var attendre = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };

/* ---------- Sauvegarde ---------- */
var CLE = 'kwelafe-education-volcan-v1';
var etat = { etoiles: {}, mode: 'trankil', phrase: '' };
try { var lu = JSON.parse(localStorage.getItem(CLE) || 'null'); if (lu) etat = Object.assign(etat, lu); } catch (e) {}
function sauver(){ try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) {} }

/* ---------- KwFX : le directeur d'effets ---------- */
var fx = KwFX.init({
  theme: 'volcan', public: 'enfant', mode: etat.mode, support: 'web', jeu: 'volcan-cycle3',
  conteneur: document.body, cibleScore: $('#hEtoiles'), ambiance: false, sonsPack: '../commun/kwfx-sons/'
});
var panaches = [];
function stopPanaches(){ panaches.forEach(function(p){ try { p.arreter(); } catch (e) {} }); panaches = []; try { fx.cendres(false); } catch (e) {} }
function posEl(el){ var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function svgPt(svg, x, y){ var pt = svg.createSVGPoint(); pt.x = x; pt.y = y; var p = pt.matrixTransform(svg.getScreenCTM()); return { x: p.x, y: p.y }; }
function eruptionEn(p, k){ fx.joue('eruption', { x: p.x, y: p.y, intensite: k || .9 }); fx.son('volcan'); setTimeout(function(){ fx.joue('braises', { x: p.x, y: p.y, intensite: .7 }); }, 250); }

function bonne(el, extra){ var d = fx.evenement('bonne', Object.assign({ element: el, points: 10 }, extra || {})); if (el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); } return d; }
function erreur(el){ fx.evenement('erreur', { element: el }); if (el) { el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); } }

function majEtoiles(){ var t = 0; Object.keys(etat.etoiles).forEach(function(k){ t += etat.etoiles[k] || 0; }); $('#hScore').textContent = t; return t; }
majEtoiles();
var bMode = $('#bMode');
function majMode(){ bMode.textContent = etat.mode === 'probleme' ? 'Mi rode problèm' : 'Mi vé zoué trankil'; bMode.classList.toggle('pb', etat.mode === 'probleme'); }
majMode();
bMode.addEventListener('click', function(){ etat.mode = etat.mode === 'probleme' ? 'trankil' : 'probleme'; fx.regler({ mode: etat.mode }); sauver(); majMode(); fx.evenement('clic', { element: bMode }); });

/* ---------- Mascotte paille-en-queue ---------- */
var OISEAU = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#1E5AA8"/><path d="M14 36c6-10 18-14 28-10l8-6-2 9c2 4 1 8-3 11-8 6-21 5-31-4z" fill="#fff"/><path d="M44 40c6 6 10 12 12 20" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M42 41c3 7 4 13 4 21" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="40" cy="27" r="2.2" fill="#14213d"/><path d="M47 28l9 1-8 3z" fill="#ffb000"/><path d="M24 33c4 2 10 2 14 0" stroke="#14213d" stroke-width="1.6" fill="none"/></svg>';
function kwelafe(txt){ return '<div class="kwelafe">' + OISEAU + '<div><b>Kwélafé t\'explique</b>' + txt + '</div></div>'; }

/* ---------- Modules ---------- */
var MODULES = [
  { id: 'coupe', ico: '🌋', titre: 'Dans le volcan', sous: 'Coupe du volcan, magma et lave' },
  { id: 'lave', ico: '🍯', titre: 'Effusif ou explosif ?', sous: 'L\'expérience miel et dentifrice' },
  { id: 'carte', ico: '🗺️', titre: 'Je situe le volcan', sous: 'La carte de l\'île' },
  { id: 'frise', ico: '⏳', titre: 'Les grandes éruptions', sous: 'La frise de 1977 à 2007' },
  { id: 'maths', ico: '📏', titre: 'Les maths du volcan', sous: 'Altitudes et éruptions' },
  { id: 'alerte', ico: '🚨', titre: 'Je me protège', sous: 'Les niveaux d\'alerte' },
  { id: 'kreol', ico: '🗣️', titre: 'Les mots du volcan', sous: 'En créole réunionnais' },
  { id: 'defi', ico: '🏆', titre: 'Le grand défi', sous: 'Je vérifie ce que j\'ai appris' }
];
var SAVAIS = [
  'Le Piton de la Fournaise est né il y a environ 530 000 ans. C\'est le plus jeune volcan de l\'île.',
  'Le Piton des Neiges a fait sortir l\'île de l\'océan il y a environ 3 millions d\'années. Il ne fait plus d\'éruption.',
  'C\'est un volcan de point chaud, comme les volcans d\'Hawaï : le magma monte des profondeurs de la Terre.',
  'Depuis 1979, le volcan est en éruption en moyenne 1 jour sur 8.',
  'Au sommet du Piton de la Fournaise, il y a deux cratères : Dolomieu et Bory.',
  'Quand la lave arrive dans l\'océan, l\'eau bout et forme un grand nuage blanc de vapeur.',
  'En refroidissant, la lave devient une roche noire : le basalte.'
];

function etoilesTxt(n){ var s = ''; for (var i = 0; i < 3; i++) s += '<span class="' + (i < n ? 'on' : '') + '">★</span>'; return s; }

/* ---------- Navigation ---------- */
var minuteurs = [];
function plusTard(f, ms){ var t = setTimeout(f, ms); minuteurs.push(t); return t; }
function nettoyer(){ minuteurs.forEach(clearTimeout); minuteurs = []; stopPanaches(); fx.reinitialiser(); }
function aller(id){
  nettoyer();
  window.scrollTo(0, 0);
  if (id === 'accueil' || !ECRANS[id]) return accueil();
  fx.evenement('clic');
  ECRANS[id]();
}
$('#bAccueil').addEventListener('click', function(){ aller('accueil'); });
/* Dans l'application Kwélafé Lecture : bouton de sortie et libération propre */
var dansAppli = false; try { dansAppli = window.top !== window; } catch (e) { dansAppli = true; }
if (dansAppli) $('#bSortie').classList.remove('cache');
$('#bSortie').addEventListener('click', function(){ try { if (window.top.location.origin === location.origin) { window.top.location.href = '/ecole/jeux'; return; } } catch (e) {} location.href = '/ecole/jeux'; });

function finModule(id, erreurs, extraHtml){
  var n = erreurs === 0 ? 3 : erreurs <= 2 ? 2 : 1;

  if (n > avant) { etat.etoiles[id] = n; sauver(); }

  fx.evenement('victoire');

  c.innerHTML = '<p class="consigne">Bravo, module terminé !</p><p class="texte">' + (erreurs === 0 ? 'Aucune erreur : tu es un vrai scientifique du volcan.' : 'Tu as fait ' + erreurs + ' petite' + (erreurs > 1 ? 's' : '') + ' erreur' + (erreurs > 1 ? 's' : '') + '. Chaque essai t\'aide à apprendre.') + '</p>' + (extraHtml || '') +
    '<div class="actions" style="justify-content:center"><button class="btn" data-a="rejouer">Rejouer</button>' + (suivant ? '<button class="btn feu" data-a="suivant">' + suivant.ico + ' ' + suivant.titre + '</button>' : '') + '<button class="btn" data-a="accueil">Accueil</button></div>';

  c.addEventListener('click', function(e){
    var a = e.target.closest('[data-a]'); if (!a) return;
    if (a.dataset.a === 'rejouer') aller(id); else if (a.dataset.a === 'suivant') aller(suivant.id); else aller('accueil');
  });
}

/* QCM générique : renvoie une promesse (nombre d'erreurs) */
function qcm(zone, question, options, juste, explication, opts){
  opts = opts || {};
  return new Promise(function(resoudre){
    var erreurs = 0, fini = false;
    var ordre = opts.garderOrdre ? options.map(function(_, i){ return i; }) : melange(options.map(function(_, i){ return i; }));
    var c = document.createElement('div'); c.className = 'carte';
    c.innerHTML = '<p class="consigne">' + question + '</p><div class="choix' + (options.length === 2 ? ' deux' : '') + '">' +
      ordre.map(function(i){ return '<button data-i="' + i + '">' + options[i] + '</button>'; }).join('') + '</div><div class="retour-msg"></div><div class="expl"></div>';
    zone.appendChild(c);
    var msg = $('.retour-msg', c);
    $('.choix', c).addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b || fini || b.classList.contains('faux')) return;
      var i = +b.dataset.i;
      if (i === juste) {
        fini = true; b.classList.add('juste');
        var d = bonne(b, opts.rapide ? { rapide: true } : null);
        msg.className = 'retour-msg ok'; msg.textContent = 'C\'est juste !';
        if (explication) $('.expl', c).innerHTML = kwelafe(explication);
        resoudre({ erreurs: erreurs, decision: d, carte: c });
      } else {
        erreurs++; b.classList.add('faux'); erreur(b);
        msg.className = 'retour-msg ko'; msg.textContent = opts.indice || 'Pas grave, essaie encore !';
        if (erreurs >= 2) { var bj = $('[data-i="' + juste + '"]', c); bj.classList.add('montre'); }
      }
    });
  });
}
function boutonSuite(zone, texte){
  return new Promise(function(r){
    var d = document.createElement('div'); d.className = 'actions';
    d.innerHTML = '<button class="btn feu">' + (texte || 'Continuer') + ' ➜</button>';
    zone.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('button', d).addEventListener('click', function(){ fx.evenement('clic', { element: d.firstChild }); d.remove(); r(); });
  });
}

var POS_ETIQ = { chambre: [190, 258, 'middle'], cheminee: [200, 140, 'start'], cratere: [190, 36, 'middle'], coulee: [262, 106, 'start'], ocean: [365, 205, 'middle'] };
function poserEtiquette(svg, z){
  if ($('[data-et="' + z + '"]', svg)) return;
  var p = POS_ETIQ[z], t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', p[0]); t.setAttribute('y', p[1]); t.setAttribute('text-anchor', p[2]); t.setAttribute('data-et', z);
  t.textContent = ZONES[z].nom.split(' / ')[0];

function animerEruption(svg){
  return new Promise(function(resoudre){
    var r = $('#montee', svg), c = $('#coulee', svg), t0 = performance.now();
    c.style.transition = 'none'; c.setAttribute('stroke-dashoffset', '200');
    fx.son('volcan');
    (function monte(t){
      var k = Math.min(1, (t - t0) / 1400), h = 150 * k * k;
      r.setAttribute('y', 206 - h); r.setAttribute('height', h);
      if (k < 1) return requestAnimationFrame(monte);
      var p = svgPt(svg, 190, 50);
      eruptionEn(p, 1);
      fx.joue('etincellesChaudes', { x: p.x, y: p.y });
      c.style.transition = 'stroke-dashoffset 2.2s ease-in'; c.setAttribute('stroke-dashoffset', '0');
      setTimeout(function(){
        var m = svgPt(svg, 322, 172);
        fx.joue('vapeur', { x: m.x, y: m.y, intensite: 1 }); fx.joue('plouf', { x: m.x, y: m.y, intensite: .6 });
        var pa = fx.panache(m.x, m.y - 4, { type: 'vapeur', force: .8 }); panaches.push(pa);
        setTimeout(function(){ try { pa.arreter(); } catch (e) {} }, 3500);
        resoudre();
      }, 2200);
    })(t0);
  });
}

      if (b.dataset.g) { $$('[data-g]', d).forEach(function(x){ x.classList.remove('sel'); }); b.classList.add('sel'); sel = b; fx.evenement('clic', { element: b }); return; }
      if (!b.dataset.d) return;
      if (!sel) { msg.className = 'retour-msg ko'; msg.textContent = 'Touche d\'abord un niveau à gauche.'; return; }
      if (b.dataset.d === sel.dataset.g) {
        b.classList.add('fini'); sel.classList.add('fini'); sel.classList.remove('sel'); bonne(b); sel = null; faits++;
        msg.className = 'retour-msg ok'; msg.textContent = 'Bien relié !';
        if (faits === 4) plusTard(function(){ finModule('alerte', erreurs); }, 600);
      } else { erreurs++; erreur(b); msg.className = 'retour-msg ko'; msg.textContent = 'Pas tout à fait. Relis les niveaux et essaie encore.'; }
    });
  }
};

/* ================= 7. CRÉOLE ================= */
var MOTS = [['volkan', 'le volcan'], ['la lav', 'la lave'], ['ros', 'la roche'], ['dofé', 'le feu'], ['la pété', 'il entre en éruption']];
ECRANS.kreol = function(){
  var m = mod('kreol'), erreurs = 0;
  ecran.innerHTML = enTete(m, 3) +
    '<div class="carte"><p class="consigne">1. Touche chaque carte pour la retourner.</p><div class="cartes-kreol">' +
    MOTS.map(function(w, i){ return '<div class="flip" data-i="' + i + '"><div class="in"><div class="face avant">' + w[0] + '</div><div class="face arriere">' + w[1] + '</div></div></div>'; }).join('') + '</div></div><div id="suite"></div>';
  etape(1);
  var suite = $('#suite'), vus = {};
  $('.cartes-kreol').addEventListener('click', function(e){
    var f = e.target.closest('.flip'); if (!f) return;
    f.classList.toggle('tourne');
    if (!vus[f.dataset.i]) { vus[f.dataset.i] = 1; fx.evenement('trouve', { element: f, points: 10 }); } else fx.evenement('clic', { element: f });
    if (Object.keys(vus).length === 5 && !vus.ok) { vus.ok = 1; plusTard(phrase, 700); }
  });
  function phrase(){
    etape(2);
    var d = document.createElement('div'); d.className = 'carte';
    d.innerHTML = '<p class="consigne">2. Lis la phrase en créole, puis touche-la pour voir le français.</p><p class="phrase-kreol" id="pk" style="cursor:pointer">Piton la Fournèz sé in volkan vivan. Kan li pèt, la lav i koul ziska la mèr. Lo Préfé i fèrm lansklo pou protèz bann moun.</p><p class="texte cache" id="pf">Le Piton de la Fournaise est un volcan vivant. Quand il entre en éruption, la lave coule jusqu\'à la mer. Le préfet ferme l\'enclos pour protéger les gens.</p>';
    suite.appendChild(d); d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('#pk').addEventListener('click', function(){
      if (!$('#pf').classList.contains('cache')) return;
      $('#pf').classList.remove('cache'); fx.evenement('trouve', { element: $('#pf') });
      boutonSuite(suite, 'J\'écris en créole').then(ecrire);
    });
  }
  function ecrire(){
    etape(3);
    var d = document.createElement('div'); d.className = 'carte';
    d.innerHTML = '<p class="consigne">3. Complète : « Kan volkan i pèt, la <span class="trou" id="trou">…</span> i koul. »</p>';
    suite.appendChild(d);
    qcm(suite, 'Quel mot va dans le trou ?', ['lav', 'ros', 'dofé'], 0, 'Kan volkan i pèt, la <b>lav</b> i koul : quand le volcan entre en éruption, la lave coule.').then(function(r){
      erreurs += r.erreurs; $('#trou').textContent = 'lav'; fx.joue('braises', { element: $('#trou'), intensite: .6 });
      return qcm(suite, 'Comment dit-on « la roche » en créole ?', ['ros', 'volkan', 'la lav'], 0);
    }).then(function(r){
      erreurs += r.erreurs;
      return qcm(suite, 'Que veut dire « dofé » ?', ['le feu', 'la mer', 'le volcan'], 0);
    }).then(function(r){
      erreurs += r.erreurs;
      var c = document.createElement('div'); c.className = 'carte';
      c.innerHTML = '<p class="consigne">Invente une phrase avec le mot <span class="cible">volkan</span>.</p><textarea id="maPhrase" placeholder="Écris ta phrase ici…"></textarea><p class="texte" style="color:var(--doux);font-size:14px;margin-top:8px">Montre ta phrase à ton maître ou à ta maîtresse pour la faire relire.</p><div class="actions"><button class="btn feu" id="bGarde">Garder ma phrase</button></div>';
      suite.appendChild(c); c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      $('#maPhrase').value = etat.phrase || '';
      $('#bGarde').addEventListener('click', function(){
        etat.phrase = $('#maPhrase').value.trim(); sauver();
        if (etat.phrase.toLowerCase().indexOf('volkan') >= 0) fx.evenement('pepite', { element: this }); else fx.evenement('presque', { element: this });
        this.disabled = true; finModule('kreol', erreurs);
      });
    });
  }
};

/* ================= 8. LE GRAND DÉFI ================= */
var QUIZ = [
  ['Comment appelle-t-on le magma quand il sort du volcan ?', ['La lave', 'Le basalte', 'La cendre'], 0],
  ['Vrai ou faux : la lave du Piton de la Fournaise est très fluide.', ['Vrai', 'Faux'], 0],
  ['Que se passe-t-il pour les randonneurs en alerte 1 ?', ['L\'enclos est fermé, il faut sortir', 'On peut randonner normalement', 'On doit aller voir le cratère'], 0],
  ['Le volcan fait environ 2 éruptions par an. Combien en 5 ans ?', ['7', '10', '25'], 1],
  ['Quel est le mot créole pour « volcan » ?', ['dofé', 'ros', 'volkan'], 2],
  ['En refroidissant, la lave devient…', ['du basalte', 'du sable blanc', 'du magma'], 0],
  ['« La lave est orange. » Est-ce que…', ['J\'observe', 'J\'interprète'], 0],
  ['« L\'île grandit avec la lave. » Est-ce que…', ['J\'observe', 'J\'interprète'], 1],
  ['Pourquoi le Piton de la Fournaise est-il un volcan effusif ?', ['Sa lave est fluide et coule', 'Son gaz explose très fort', 'Il ne fait jamais d\'éruption'], 0],
  ['Quel volcan de l\'île ne fait plus d\'éruption ?', ['Le Piton de la Fournaise', 'Le Piton des Neiges'], 1],
  ['Qui surveille le volcan jour et nuit ?', ['Les scientifiques de l\'Observatoire', 'Personne', 'Les randonneurs'], 0],
  ['Quelle est l\'altitude du Piton de la Fournaise ?', ['2 311 m', '2 632 m', '3 070 m'], 1]
];
ECRANS.defi = function(){
  var m = mod('defi'), erreurs = 0, score = 0, i = 0;
  var liste = etat.mode === 'probleme' ? melange(QUIZ) : QUIZ.slice();
  ecran.innerHTML = enTete(m) + '<div class="score-defi"><span id="qn">Question 1/' + liste.length + '</span><span class="sc" id="sc">0</span></div><div id="zq"></div>';
  var zq = $('#zq');
  fx.evenement('debut');
  (function suivante(){
    if (i >= liste.length) return bilan();
    var q = liste[i]; $('#qn').textContent = 'Question ' + (i + 1) + '/' + liste.length; i++;
    zq.innerHTML = '';
    var t0 = performance.now();
    qcm(zq, q[0], q[1], q[2], null, { garderOrdre: q[1].length === 2, rapide: etat.mode === 'probleme' }).then(function(r){
      erreurs += r.erreurs;
      var pts = r.erreurs === 0 ? 10 : r.erreurs === 1 ? 5 : 2;
      if (etat.mode === 'probleme' && r.erreurs === 0 && performance.now() - t0 < 6000) pts += 5;
      var gain = Math.round(pts * (r.decision.multiplicateur || 1)) + (r.decision.pepite ? 20 : 0);
      score += gain; fx.compteur($('#sc'), score);
      plusTard(suivante, 850);
    });
  })();
  function bilan(){
    var res = fx.finPartie(score);
    var n = erreurs === 0 ? 3 : erreurs <= 3 ? 2 : 1;
    if (n > (etat.etoiles.defi || 0)) { etat.etoiles.defi = n; sauver(); }
    var total = majEtoiles(), tous = MODULES.every(function(x){ return etat.etoiles[x.id]; });
    fx.evenement('victoire');
    zq.innerHTML = '<div class="carte bilan"><p class="consigne">Ton score</p><div class="gros" id="scF">0</div>' +
      '<p class="texte">' + (res.nouveauRecord ? '🎉 Nouveau record ! ' : '') + 'Record : <b>' + res.record + '</b></p>' +
      '<p class="texte">Défi du jour : ' + res.defi.texte + (res.defi.reussi ? ' ✅' : '') + '</p>' +
      '<p class="texte">Objets rares péi : <b>' + res.collection.obtenus + ' / ' + res.collection.total + '</b></p>' +
      (tous ? '<span class="badge">🌋 Gardien du volcan</span>' : '<p class="texte" style="color:var(--doux)">Termine les 8 modules pour devenir <b>Gardien du volcan</b>.</p>') +
      '</div><div class="carte"><p class="consigne">Je m\'auto-évalue. Je sais…</p><div class="choix" id="auto">' +
      ['expliquer magma et lave', 'dire pourquoi le volcan est effusif', 'lire un graphique', 'citer les niveaux d\'alerte', 'utiliser des mots créoles'].map(function(s){ return '<button>☐ ' + s + '</button>'; }).join('') + '</div></div>' +
      '<div class="carte">' + kwelafe('<b style="display:inline;color:#fff">À la maison : enquête gramoun.</b> Demande à un adulte de ta famille : as-tu déjà vu une éruption ? Qu\'as-tu ressenti ? Connais-tu un mot ou une histoire créole sur le volcan ?') + '</div>' +
      '<div class="actions" style="justify-content:center"><button class="btn feu" id="bRe">Rejouer</button><button class="btn" id="bAcc">Accueil</button></div>';
    fx.compteur($('#scF'), score);
    plusTard(function(){ fx.etoilesFin(n); }, 900);
    if (tous) plusTard(function(){ fx.joue('feu', { intensite: 1 }); fx.joue('banniere', { texte: 'Gardien du volcan !' }); }, 2600);
    $('#auto').addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; var on = b.textContent[0] === '☐'; b.textContent = (on ? '☑' : '☐') + b.textContent.slice(1); b.classList.toggle('juste', on); if (on) fx.evenement('bonne', { element: b, points: 0 }); });
    $('#bRe').addEventListener('click', function(){ aller('defi'); });
    $('#bAcc').addEventListener('click', function(){ aller('accueil'); });
  }
};

/* ================= ENSEIGNANT ================= */

  ecran.innerHTML = '<div class="titre-mod"><div class="ico">👩🏽‍🏫</div><div><h2>Pour l\'enseignant</h2><p>Ressource n°1 · Nature et environnement · Cycle 3 (CM1-CM2, adaptable en 6e)</p></div></div>' +
    '<div class="carte prof"><p class="consigne">À la fin, l\'élève sait…</p><p class="texte">1. Expliquer ce qu\'est un volcan et d\'où vient la lave. 2. Dire pourquoi le Piton de la Fournaise est un volcan effusif. 3. Lire un graphique et un tableau de données. 4. Citer les niveaux d\'alerte et le bon comportement. 5. Utiliser 5 mots du volcan en créole.</p>' +

    '<tr><td>3. Je situe le volcan</td><td>1</td><td>Géographie</td></tr><tr><td>4. Les grandes éruptions</td><td>2</td><td>Histoire, lecture de frise</td></tr>' +
    '<tr><td>5. Les maths du volcan</td><td>3</td><td>Maths (★ défi CM2)</td></tr><tr><td>6. Je me protège</td><td>4</td><td>EMC, géographie</td></tr>' +
    '<tr><td>7. Les mots du volcan</td><td>4</td><td>Créole, français</td></tr><tr><td>8. Le grand défi</td><td>4</td><td>Évaluation et auto-évaluation</td></tr></table>' +
    '<p class="texte" style="margin-top:10px">Au tableau numérique, l\'application s\'affiche en grand. Le bouton « Mi vé zoué trankil / Mi rode problèm » règle l\'intensité des effets ; en mode problèm, le grand défi mélange les questions et récompense la rapidité. Les progrès sont gardés sur l\'appareil. Aucune voix : uniquement des bruitages.</p></div>' +
    '<div class="carte prof"><p class="consigne">Sources</p><table><tr><th>Information</th><th>Source</th></tr>' +

    '<tr><td>En éruption 1 jour sur 8 depuis 1979</td><td>Ministère de la Transition écologique, chiffres clés des risques naturels</td></tr>' +
    '<tr><td>Niveaux d\'alerte, fermeture de l\'enclos, alertes 2-1 et 2-2</td><td>Préfecture de La Réunion, disposition spécifique ORSEC Volcan</td></tr>' +
    '<tr><td>Éruptions 1977, 1986, 1998 et 2007 (240 millions de m³)</td><td>OVPF-IPGP ; Encyclopædia Universalis</td></tr>' +
    '<tr><td>Âge du volcan (530 000 ans), cratères Dolomieu et Bory, point chaud</td><td>Encyclopædia Universalis ; Futura-Sciences</td></tr>' +
    '<tr><td>Naissance de l\'île il y a environ 3 millions d\'années</td><td>Académie de La Réunion (ressources SVT)</td></tr>' +
    '<tr><td>Piton des Neiges 3 070 m</td><td>CNES, Géoimage</td></tr></table>' +
    '<p class="texte" style="margin-top:10px;color:var(--doux);font-size:14px">Créole à faire relire dans la graphie de l\'Académie de La Réunion. Textes, schémas, activités © Kwélafé Production.</p></div>' +
    '<div class="actions"><button class="btn" id="bRaz">Effacer les progrès</button><button class="btn feu" id="bAcc2">Accueil</button></div>';
  $('#bAcc2').addEventListener('click', function(){ aller('accueil'); });
  $('#bRaz').addEventListener('click', function(){ etat.etoiles = {}; etat.phrase = ''; sauver(); majEtoiles(); this.textContent = 'Progrès effacés'; this.disabled = true; });
}

var ECRANS;
accueil();
})();
</script>
