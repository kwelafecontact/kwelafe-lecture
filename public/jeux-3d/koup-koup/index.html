  .ecran.cache { opacity:0; }
  .titre { font-size:clamp(58px, 14vw, 120px); font-weight:800; line-height:.9; color:var(--or); letter-spacing:.01em; text-shadow:0 5px 0 #a8460a, 0 10px 0 #5a2406, 0 18px 30px rgba(0,0,0,.5); transform:rotate(-3deg); }

  @keyframes pulse { 50% { transform:scale(1.06); } }
  .btn { pointer-events:auto; margin-top:22px; border:0; border-radius:999px; padding:14px 34px; font:800 20px/1 "Baloo 2", system-ui, sans-serif; color:#3a1a04; background:linear-gradient(#ffe27a, #ffb21e); box-shadow:0 5px 0 #a8580a, 0 10px 22px rgba(0,0,0,.4); cursor:pointer; }

  @keyframes feu { from { box-shadow:0 0 10px 2px #ff8a1e, 0 0 24px 6px rgba(255,80,0,.45); } to { box-shadow:0 0 16px 4px #ffc23a, 0 0 42px 12px rgba(255,120,0,.65); } }
  .pop { position:fixed; pointer-events:none; font-weight:800; transform:translate(-50%,-50%); text-shadow:0 3px 0 rgba(0,0,0,.35), 0 0 14px rgba(0,0,0,.4); animation:monte .9s ease-out forwards; white-space:nowrap; }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
import { MeshoptDecoder } from './lib/meshopt_decoder.module.js';
import { GestionnairePerf, dprCible, appareil, afficherSecours, reveillerAudio, endormirAudio, journal, libererCanvas } from '../commun/performances.js';

{
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const TEST = new URLSearchParams(location.search).has('test');
// Qualité : 2 = haute, 1 = moyenne, 0 = basse. Baisse toute seule si le jeu ralentit.
let QUALITE = (() => {
  const f = new URLSearchParams(location.search).get('qualite'); if (f !== null) return Math.max(0, Math.min(2, +f));
  const c = navigator.hardwareConcurrency || 4; const q = c >= 6 ? 2 : c >= 4 ? 1 : 0;
  return appareil.iphone ? Math.min(q, 1) : q; // iPhone : on démarre en qualité moyenne
})();
// Mémoire : les 32 modèles d'origine (textures 1024 px) demandaient plus de 1 Go de mémoire graphique
// une fois tous chargés, ce qui faisait planter Safari sur iPhone (écran noir puis rechargement).
// Sur téléphone et tablette : modèles aux textures 512 px et nombre de fruits chargés limité,
// renouvelés pendant la partie pour garder toute la variété.
const MOBILE = appareil.ios || appareil.tactile;
const PARAMS = new URLSearchParams(location.search);
const DOSSIER_MODELES = (MOBILE && !PARAMS.has('hd')) || PARAMS.has('mobile') ? './models/mobile/' : './models/';
const MAX_CHARGES = +PARAMS.get('max') || (appareil.iphone ? 10 : MOBILE ? 14 : 20);
const PROTEGES = new Set(['mangue', 'letchi']); // menu et letchi doré
const ratioRendu = () => Math.min(dprCible(2), [1, 1.4, 1.75][QUALITE]);
const qx = () => [0.45, 0.75, 1][QUALITE];

// ---------------------------------------------------------------- rendu
const glc = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: TEST });
renderer.setPixelRatio(ratioRendu());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
function construireEnvironnement() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const ancien = scene.environment;
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  if (ancien) ancien.dispose();
  pmrem.dispose();
}
construireEnvironnement();
scene.environmentIntensity = 0.8;
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0, 14);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.8); sun.position.set(3, 6, 8); scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfdcff, 1.6); rim.position.set(-6, 3, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xfff4dc, 0x6a4020, 0.4));

let W = 0, H = 0, viewH = 10, viewW = 10;
const fond = $('fond'), taches = $('taches'), trace = $('trace'), vitre = $('vitre'), fanions = $('fanions');
const anctx = fanions.getContext('2d');
const fctx = fond.getContext('2d'), tctx = taches.getContext('2d'), bctx = trace.getContext('2d'), vctx = vitre.getContext('2d');
// calques hors écran qui gardent les taches (étal) et les traînées (vitre) d'une image à l'autre
const couche = document.createElement('canvas'), cctx = couche.getContext('2d');
const coucheVitre = document.createElement('canvas'), cvctx = coucheVitre.getContext('2d');
function resize() {
  W = innerWidth; H = innerHeight;
  const dpr = dprCible(2); // 1,5 au plus sur iPhone : 7 calques plein écran
  for (const c of [fond, taches, trace, vitre, couche, coucheVitre, fanions]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  // garder une largeur jouable en portrait
  camera.fov = W < H ? Math.min(62, 40 * Math.max(1, 0.75 / camera.aspect)) : 40;
  camera.updateProjectionMatrix();
  viewH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  viewW = viewH * camera.aspect;
  peindreFond();
}

// Décor : étal en bois du marché forain, fanions aux couleurs de La Réunion
function peindreFond() {
  const g = fctx;
  const grd = g.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#6b3f1d'); grd.addColorStop(1, '#3d220e');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const nb = Math.max(5, Math.round(W / 150)), lw = W / nb;
  for (let i = 0; i < nb; i++) {
    const x = i * lw, teinte = [0, 8, -6, 4, -10, 6][i % 6];
    const pl = g.createLinearGradient(x, 0, x + lw, 0);
    pl.addColorStop(0, `hsl(${26 + teinte * .3} 48% ${30 + teinte * .4}%)`);
    pl.addColorStop(.5, `hsl(${28 + teinte * .3} 50% ${36 + teinte * .4}%)`);
    pl.addColorStop(1, `hsl(${25 + teinte * .3} 46% ${28 + teinte * .4}%)`);
    g.fillStyle = pl; g.fillRect(x + 2, 0, lw - 4, H);
    g.save(); g.globalAlpha = .13; g.strokeStyle = '#1e0e04'; g.lineWidth = 1.2;
    for (let k = 0; k < 9; k++) {
      g.beginPath(); const ox = x + 8 + (k / 9) * (lw - 16) + Math.sin(i * 7 + k) * 4;
      g.moveTo(ox, 0);
      for (let y = 0; y <= H; y += 40) g.lineTo(ox + Math.sin(y / 90 + k * 1.7 + i) * 5, y);
      g.stroke();
    }
    g.globalAlpha = .35; g.fillStyle = '#1a0c03';
    const nx = x + lw * (0.3 + 0.4 * ((i * 37) % 10) / 10), ny = H * (0.2 + 0.6 * ((i * 53) % 10) / 10);
    g.beginPath(); g.ellipse(nx, ny, 7, 11, 0, 0, 7); g.fill();
    g.restore();
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x, 0, 3, H);
  }
  const v = g.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .25, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(255,190,90,.10)'); v.addColorStop(1, 'rgba(10,4,0,.62)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// Fanions aux couleurs de La Réunion qui ondulent doucement au vent
function dessinerFanions(t) {
  const g = anctx; g.clearRect(0, 0, W, 110);
  const cols = ['#1f5fbf', '#ffd21e', '#e8322a', '#1f9a4a'];
  const y0 = Math.max(10, H * 0.015), sag = 26, n = Math.ceil(W / 46) + 1;
  const vent = k => Math.sin(t * 1.6 + k * 0.9) * 0.18 + Math.sin(t * 0.7 + k * 0.33) * 0.1;
  g.strokeStyle = 'rgba(255,240,210,.6)'; g.lineWidth = 2; g.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40; g.lineTo(u * W, y0 + Math.sin(u * Math.PI) * (sag + Math.sin(t * 0.8) * 2)); } g.stroke();
  for (let i = 0; i < n; i++) {
    const u = (i + .5) / n, x = u * W, y = y0 + Math.sin(u * Math.PI) * (sag + Math.sin(t * 0.8) * 2);
    const a = vent(i), bx = x + Math.sin(a) * 30, by = y + Math.cos(a) * 30;
    g.fillStyle = cols[i % 4]; g.beginPath(); g.moveTo(x - 16, y); g.lineTo(x + 16, y); g.lineTo(bx, by); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,255,255,${0.14 + a * 0.3})`; g.beginPath(); g.moveTo(x - 16, y); g.lineTo(x, y); g.lineTo(bx, by); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 16, y); g.lineTo(bx, by); g.closePath(); g.fill();
  }
}

// ---------------------------------------------------------------- sons (synthétisés, sans voix)
let actx = null, maitre = null, bruit = null, filtreRalenti = null, sonCoupe = false;
try { sonCoupe = localStorage.getItem('koupkoup_son') === 'non'; } catch (e) {}
function audio() {
  if (actx) { reveillerAudio(actx); return; } // iOS : « suspended » ou « interrupted »
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    // chaîne : sons -> maître -> filtre (ralenti) -> compresseur -> haut-parleurs
    maitre = actx.createGain(); maitre.gain.value = sonCoupe ? 0 : 0.7;
    filtreRalenti = actx.createBiquadFilter(); filtreRalenti.type = 'lowpass'; filtreRalenti.frequency.value = 20000;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    maitre.connect(filtreRalenti); filtreRalenti.connect(comp); comp.connect(actx.destination);
    bruit = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ambianceMarche();
  } catch (e) { actx = null; }
}
const hauteur = () => 2 ** (rnd(-2.5, 2.5) / 12); // petite variation à chaque son
function sNoise(dur, f0, f1, q, vol, type = 'bandpass', when = 0) {
  if (!actx) return; const t = actx.currentTime + when;
  const s = actx.createBufferSource(); s.buffer = bruit;
  const f = actx.createBiquadFilter(); f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(maitre); s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
}
function sTone(freq, dur, vol, type = 'sine', when = 0, glide = 1) {
  if (!actx) return; const t = actx.currentTime + when;
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(maitre); o.start(t); o.stop(t + dur + 0.02);
}
// Familles de fruits pour le son de la découpe
const CROQUANTS = new Set(['chouchou', 'carambole', 'coco', 'combava', 'citron-galet', 'margoze', 'bringelle', 'piment', 'avocat', 'evi', 'jambos-rouge']);
const SOURDS = new Set(['citrouille', 'jacque', 'fruit-a-pain', 'songe', 'corossol', 'ananas']);
const son = {
  // le « whoosh » suit la vitesse du doigt
  swoosh: (v = 1) => { const k = Math.min(2.2, Math.max(0.6, v)); sNoise(0.14 + 0.06 / k, 700 * k, 3400 * k, 1.1, 0.07 + 0.06 * Math.min(k, 1.6)); },
  coupe: id => {
    const h = hauteur();
    if (CROQUANTS.has(id)) {          // croquant : petits craquements secs
      for (let i = 0; i < 3; i++) sNoise(0.035, 4200 * h, 2600 * h, 4, 0.32 - i * 0.07, 'bandpass', i * 0.022);
      sTone(380 * h, 0.06, 0.12, 'triangle', 0, 0.6);
    } else if (SOURDS.has(id)) {      // sourd : chair dense et épaisse
      sTone(95 * h, 0.22, 0.45, 'sine', 0, 0.55); sNoise(0.18, 900 * h, 200, 0.8, 0.4, 'lowpass');
    } else {                          // juteux : chair qui s'ouvre et jus qui gicle
      sNoise(0.2, 2400 * h, 500, 1.4, 0.38, 'bandpass'); sNoise(0.12, 6000, 2500, 2, 0.12);
      sTone(170 * h, 0.1, 0.25, 'sine', 0, 0.5);
      for (let i = 0; i < 2; i++) sTone(rnd(500, 900) * h, 0.05, 0.05, 'sine', 0.04 + i * 0.03, 1.8); // petites bulles
    }
  },
  note: n => sTone(523 * 2 ** ([0, 4, 7, 12, 16, 19, 24][Math.min(6, n - 1)] / 12), 0.2, 0.15, 'triangle'),

    const r = rnd(7, 16);

      x: Math.min(W - 30, Math.max(30, sx + dir.x * rnd(30, 140) + rnd(-40, 40))),
      y: Math.min(H - 80, Math.max(60, sy - dir.y * rnd(30, 140) + rnd(-40, 40))),
      r, c, apparition: 0, attente: rnd(0.35, 1.2), v: 0, vmax: rnd(50, 130), phase: rnd(0, 6),

// ---------------------------------------------------------------- objets du jeu
const objets = [];   // fruits et roches en vol
const moities = [];  // moitiés coupées
let etat = 'menu', score = 0, vies = 3, record = 0, temps = 0, niveau = 0;
let arret = 0, ralenti = 0, ralentiOr = 0, tremble = 0, zoom = 0, prochainLancer = 1, mangueMenu = null;

const matOr = new THREE.MeshPhysicalMaterial({ color: 0xffc83a, metalness: 1, roughness: 0.16, clearcoat: 1, clearcoatRoughness: 0.08, emissive: 0x6a4200, emissiveIntensity: 0.55 });

try { record = +(localStorage.getItem('koupkoup_record') || 0); } catch (e) {}

function lancer(fruit, opts = {}) {
  const roche = !fruit;
  const grp = roche ? new THREE.Mesh(rocheGeo, rocheMat) : fruit.entier.clone();
  if (opts.or) { dorer(grp); grp.scale.multiplyScalar(1.15); }
  const vanille = !roche && !opts.menu && fruit.d.id === 'vanille';
  const x0 = opts.x ?? rnd(-viewW * 0.38, viewW * 0.38);
  const y0 = -viewH / 2 - 1.2;
  const sommet = rnd(viewH * 0.08, viewH * 0.38);
  const g = 11;
  const vy = Math.sqrt(2 * g * (sommet - y0));
  const tVol = 2 * vy / g;
  const vx = (-x0 * rnd(0.5, 1.1) + rnd(-1.2, 1.2)) / tVol;
  grp.position.set(x0, y0, rnd(-0.6, 0.6));
  grp.rotation.set(rnd(0, 6), rnd(0, 6), rnd(0, 6));
  scene.add(grp);
  const o = { roche, fruit, obj: grp, vel: new THREE.Vector3(vx, vy, 0), axe: new THREE.Vector3(rnd(-1, 1), rnd(-1, 1), rnd(-1, 1)).normalize(), vrot: rnd(1.5, 4.5), rayon: roche ? 0.62 : fruit.rayon * (opts.or ? 1.25 : 1), g, vivant: true, menu: !!opts.menu, or: !!opts.or, vanille };
  if (vanille) {
    // la gousse de vanille tombe toujours depuis le haut de l'écran, en virevoltant
    grp.position.set(rnd(-viewW * 0.36, viewW * 0.36), viewH / 2 + 1.2, rnd(-0.3, 0.3));
    o.vel.set(rnd(-0.7, 0.7), -rnd(0.6, 1.6), 0); o.g = 3.2; o.vrot = rnd(1, 2.2); o.rayon = Math.max(o.rayon, 0.75);
  }
  if (opts.menu) { o.vel.set(0, 0, 0); grp.position.set(0, opts.y ?? 0.3, 0); o.vrot = 0.9; o.axe.set(0.2, 1, 0.1).normalize(); }
  objets.push(o);
  if (!opts.menu) son.lance();
  return o;
}

function couper(o, dir, precision = 1) {
  o.vivant = false; scene.remove(o.obj);
  const pos = o.obj.position.clone();
  if (o.roche) {
    son.roche(); tremble = 0.5; try { navigator.vibrate && navigator.vibrate([40, 30, 60]); } catch (e) {} etincelles(pos, 70, 0xff7a1a); etincelles(pos, 30, 0x333333);
    const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 0.85; requestAnimationFrame(() => { f.style.transition = 'opacity .6s'; f.style.opacity = 0; });
    popup('Aïe ! Une roche du volcan !', pos, 'aie');
    perdreVie(); perdreVie();
    return;
  }
  const f = o.fruit;
  son.coupe(f.d.id);
  arret = 0.04;                                   // très courte pause d'impact
  tremble = Math.max(tremble, 0.05 + f.rayon * 0.06);
  eclats.push({ p: toScreen(pos), t: 0, c: f.jus });
  // plan de coupe : contient la direction du geste et l'axe de vue
  const n = new THREE.Vector3(-dir.y, dir.x, 0).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
  const yApres = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
  const ang = Math.atan2(new THREE.Vector3().crossVectors(yApres, dir).dot(n), yApres.dot(dir));
  q.premultiply(new THREE.Quaternion().setFromAxisAngle(n, ang + rnd(-0.3, 0.3)));

    const m = f[nom].clone(); m.position.copy(pos); m.quaternion.copy(q); scene.add(m);
    if (o.or) dorer(m);
    const cap = n.clone().multiplyScalar(-sgn);
    const axe = dir.clone(); const sens = Math.sign(new THREE.Vector3().crossVectors(axe, cap).z) || 1;
    moities.push({ fruit: f, jus: o.or ? new THREE.Color(0xffd23a) : f.jus, obj: m, vel: o.vel.clone().multiplyScalar(0.4).addScaledVector(n, sgn * rnd(2.2, 3.2)).add(new THREE.Vector3(0, 1.5, 0)), axe, vrot: sens * rnd(2.2, 3.4), vie: 4 });
  }
  const jus = o.or ? new THREE.Color(0xffd23a) : f.jus;
  giclee(pos, dir, jus, o.or ? 60 : 34, f.d.id);
  const s = toScreen(pos);
  tache(s.x, s.y, jus, pxRayon(f.rayon) * 0.9, dir);
  if (Math.random() < (o.or ? 1 : 0.3)) gouttesEcran(s.x, s.y, jus, dir);
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  if (o.menu) { demarrer(); return; }
  let pts = 1;
  if (o.vanille) pts = 3;
  if (o.or) {
    pts = 5;
    ralenti = Math.max(ralenti, 4); ralentiOr = 4;
    son.or(); etincelles(pos, 90, 0xffd84a); etincelles(pos, 40, 0xffffff);
    popup('Ralenti doré !', pos.clone().add(new THREE.Vector3(0, 1.2, 0)), 'or');
  }
  const parfait = precision < 0.28 && !o.or;
  if (parfait) pts += 1;
  score += pts; coupeSwipe += pts; majScore();
  const clair = teinteTache(jus).offsetHSL(0, 0.15, 0.08);
  popup('+' + pts, pos, 'pts', '#' + clair.getHexString());
  if (parfait) setTimeout(() => popup('Pile au centre !', pos.clone().add(new THREE.Vector3(0, -0.9, 0)), 'bonus'), 120);
  if (o.vanille) setTimeout(() => popup('Vanille !', pos.clone().add(new THREE.Vector3(0, -0.9, 0)), 'bonus'), 120);
}

function perdreVie() {
  if (etat !== 'jeu') return;
  vies = Math.max(0, vies - 1); majVies();
  if (vies === 0) finPartie();
}

// ---------------------------------------------------------------- écran, HUD
const SVG_VIE = c => `<svg viewBox="0 0 32 32"><path d="M16 9c-5-6-13-3-13 4 0 8 13 15 13 15s13-7 13-15c0-7-8-10-13-4z" fill="${c}" stroke="#4a1a04" stroke-width="1.5"/><path d="M15 9c0-3 2-5 5-6" stroke="#2f7a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/><g class="x" opacity="0"><path d="M8 8l16 16M24 8L8 24" stroke="#e8322a" stroke-width="4" stroke-linecap="round"/></g></svg>`;
function majVies() { $('vies').innerHTML = [0, 1, 2].map(i => SVG_VIE('#ffb21e').replace('<svg', `<svg class="${i >= vies ? 'perdue' : ''}"`)).join(''); }
function majScore() { $('score').textContent = score; $('meilleurHud').textContent = 'Record : ' + Math.max(record, score); }
function popup(txt, pos, cls, couleur) {
  const s = toScreen(pos), e = document.createElement('div'); e.className = 'pop ' + cls; e.textContent = txt;
  if (couleur) e.style.color = couleur;

function menuMangue() {

function demarrer(reprise) {

  if (score > record) { record = score; try { localStorage.setItem('koupkoup_record', record); } catch (e) {} }

// ---------------------------------------------------------------- geste de découpe
const trait = []; let appui = false, dernier = null, comboN = 0, comboT = 0, comboPos = null, swooshT = 0;
function pointer(e) { return { x: e.clientX, y: e.clientY, t: performance.now() }; }
glc.addEventListener('pointerdown', e => { audio(); appui = true; dernier = pointer(e); trait.length = 0; trait.push(dernier); comboN = 0; coupeSwipe = 0; });
addEventListener('pointermove', e => {
  if (!appui) return;
  const p = pointer(e);
  if (dernier) testerCoupe(dernier, p);
  trait.push(p); dernier = p;
});
const finAppui = () => { appui = false; dernier = null; finCombo(); };
addEventListener('pointerup', finAppui); addEventListener('pointercancel', finAppui);
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

function testerCoupe(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
  const vit = L / Math.max(b.t - a.t, 1);
  if (L < 4 || vit < 0.1) return;
  if (performance.now() - swooshT > 150 && vit > 0.8) { son.swoosh(vit); swooshT = performance.now(); }
  for (const o of objets) {
    if (!o.vivant) continue;
    const c = toScreen(o.obj.position), r = pxRayon(o.rayon);
    const t = Math.max(0, Math.min(1, ((c.x - a.x) * dx + (c.y - a.y) * dy) / (L * L)));
    const d = Math.hypot(a.x + dx * t - c.x, a.y + dy * t - c.y);
    if (d < r) {
      const dir = new THREE.Vector3(dx, -dy, 0).normalize();
      couper(o, dir, d / r);
      if (!o.roche && !o.menu) { comboN++; comboT = performance.now(); comboPos = o.obj.position.clone(); if (comboN >= 2) son.note(comboN); }
    }
  }
}
function finCombo() {
  // plusieurs fruits d'un seul geste : les points du geste sont multipliés
  if (comboN >= 2 && etat === 'jeu') {
    const bonus = coupeSwipe * (comboN - 1);
    score += bonus; majScore(); son.combo(comboN);
    popup(`Multi ×${comboN} ! +${bonus}`, comboPos, 'combo');
    etincelles(comboPos, 30 + comboN * 12);
    if (comboN >= 3) { ralenti = Math.max(ralenti, 0.35); zoom = 1; }
  }
  comboN = 0; coupeSwipe = 0;
}

const eclats = []; // petits éclats lumineux à chaque fruit traversé
function dessinerTrait(dt = 0.016) {
  bctx.clearRect(0, 0, W, H);
  const now = performance.now();
  while (trait.length && now - trait[0].t > 150) trait.shift();
  if (trait.length >= 2) {
    // points lissés (Catmull-Rom) pour une traînée sans saccade

      const p0 = trait[Math.max(0, i - 1)], p1 = trait[i], p2 = trait[i + 1], p3 = trait[Math.min(trait.length - 1, i + 2)];
      for (let k = 0; k < 4; k++) {
        const t = k / 4, t2 = t * t, t3 = t2 * t;
        pts.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),

    for (const [larg, coul, flou] of [[18, 'rgba(255,140,30,.3)', 22], [8, 'rgba(255,222,130,.9)', 12], [3, '#ffffff', 0]]) {
      bctx.shadowBlur = flou; bctx.shadowColor = '#ff8a1e'; bctx.strokeStyle = coul;
      for (let i = 1; i < pts.length; i++) {
        const k = i / pts.length, vit = Math.min(2.4, 0.5 + pts[i].v * 0.6);   // plus large quand le geste est rapide
        bctx.lineWidth = larg * k * vit;

    bctx.shadowBlur = 0;
  }
  for (let i = eclats.length - 1; i >= 0; i--) {
    const e = eclats[i]; e.t += dt; const k = e.t / 0.22;
    if (k >= 1) { eclats.splice(i, 1); continue; }
    const r = 14 + k * 46, g = bctx.createRadialGradient(e.p.x, e.p.y, 0, e.p.x, e.p.y, r);
    g.addColorStop(0, `rgba(255,255,240,${0.85 * (1 - k)})`); g.addColorStop(0.4, rgba(teinteTache(e.c), 0.5 * (1 - k))); g.addColorStop(1, 'rgba(255,200,120,0)');
    bctx.fillStyle = g; bctx.beginPath(); bctx.arc(e.p.x, e.p.y, r, 0, 7); bctx.fill();
  }
}

// ---------------------------------------------------------------- vagues de lancers
function vague() {
  niveau = Math.min(12, Math.floor(temps / 14));
  const n = 1 + Math.floor(Math.random() * Math.min(1 + niveau * 0.6, 5));
  const chanceRoche = temps < 10 ? 0 : Math.min(0.08 + niveau * 0.018, 0.24);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      if (etat !== 'jeu' || !prets.length) return;
      if (Math.random() < chanceRoche) lancer(null);
      else lancer(prets[Math.floor(Math.random() * prets.length)]);
      // de temps en temps, un letchi doré (un seul à la fois)
      if (i === 0 && temps > 12 && cache['letchi'] && !objets.some(x => x.or && x.vivant) && Math.random() < 0.07) setTimeout(() => etat === 'jeu' && lancer(cache['letchi'], { or: true }), 350);
    }, i * rnd(120, 300));
  }
  prochainLancer = Math.max(0.9, 2.4 - niveau * 0.13) + rnd(0, 0.6);
}

// ---------------------------------------------------------------- gestionnaire de performances commun
// Qualité par paliers puis mode 30 i/s, arrêt complet en arrière-plan, perte de contexte WebGL,
// sauvegarde de la partie en cours (score, vies, temps) pour la reprendre après une interruption.
let contextePerdu = false, pauseAuto = false;
function sauverPartie() {
  if (etat !== 'jeu') return;
  try { localStorage.setItem('koupkoup2_partie', JSON.stringify({ score, vies, temps, t: Date.now() })); } catch (e) {}
}
const perf = new GestionnairePerf({
  nom: 'koup-koup-2',
  niveauInitial: QUALITE,
  surPause: () => {
    endormirAudio(actx);
    if (etat === 'jeu') { pauseAuto = true; sauverPartie(); }
  },
  surReprise: () => {
    horloge.getDelta(); // le temps passé en arrière-plan ne compte pas
    resize();
    if (pauseAuto) afficherPause();
  },
  surSauvegarde: sauverPartie,
  surQualite: (niveau) => { if (niveau < QUALITE) { QUALITE = niveau; renderer.setPixelRatio(ratioRendu()); resize(); } },
});
perf.surveillerContexte(glc, {
  perdu: () => { contextePerdu = true; if (etat === 'jeu') { pauseAuto = true; sauverPartie(); } },
  restaure: () => {
    contextePerdu = false;
    construireEnvironnement();
    if (rocheMat.emissiveMap) rocheMat.emissiveMap.needsUpdate = true;
    resize();
    if (pauseAuto) afficherPause();
  },
  secours: () => afficherSecours({
    texte: "L'iPhone a libéré la mémoire graphique pendant la pause. Ton score est enregistré : tu pourras reprendre ta partie.",
    action: () => location.reload(), // seul le jeu est relancé, à la demande du joueur
  }),
});
// Pause au retour d'arrière-plan : la partie ne repart que quand le joueur touche l'écran
function afficherPause() {
  if ($('pauseAuto')) return;
  const v = document.createElement('div'); v.id = 'pauseAuto';
  v.style.cssText = 'position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,10,2,.55);text-align:center;touch-action:none';
  v.innerHTML = '<div class="titre" style="font-size:clamp(44px,11vw,80px)">Pause</div><div class="sous">Touche l\'écran pour reprendre</div>';
  v.addEventListener('pointerup', e => { e.stopPropagation(); pauseAuto = false; horloge.getDelta(); v.remove(); audio(); });
  document.body.appendChild(v);
}
// Reprise d'une partie interrompue (rechargement, arrêt de l'onglet par iOS)
let partieSauvee = null;
try { const p = JSON.parse(localStorage.getItem('koupkoup2_partie') || 'null'); if (p && Date.now() - p.t < 48 * 3600e3 && p.vies > 0) partieSauvee = p; } catch (e) {}
function masquerReprise() { const b = $('reprendre'); if (b) b.remove(); partieSauvee = null; }
if (partieSauvee) {
  const b = document.createElement('button'); b.id = 'reprendre'; b.className = 'btn zone-interactive';
  b.textContent = `Reprendre ma partie (${partieSauvee.score} pts)`;
  b.onclick = () => { const p = partieSauvee; masquerReprise(); demarrer(p); };
  $('jouer').after(b);
}

// ---------------------------------------------------------------- boucle
const horloge = new THREE.Clock();
const fumee = new THREE.Color(0xff8a1e);
function boucle() {
  if (contextePerdu) return;
  const vrai = pauseAuto ? (horloge.getDelta(), 0) : Math.min(horloge.getDelta(), 0.05);
  if (ralenti > 0) ralenti -= vrai;
  if (ralentiOr > 0) ralentiOr -= vrai;
  let dt = vrai * (ralenti > 0 ? (ralentiOr > 0 ? 0.35 : 0.3) : 1);
  if (arret > 0) { arret -= vrai; dt = 0; }        // pause d'impact
  document.body.classList.toggle('ralenti-or', ralentiOr > 0);
  if (filtreRalenti) filtreRalenti.frequency.setTargetAtTime(ralentiOr > 0 ? 900 : 20000, actx.currentTime, 0.15);
  $('dore').style.opacity = ralentiOr > 0 ? Math.min(1, ralentiOr * 2) : 0;
  $('barreOr').style.opacity = ralentiOr > 0 ? 1 : 0;
  if (ralentiOr > 0) $('barreOr').firstElementChild.style.width = (ralentiOr / 4 * 100) + '%';
  if (etat === 'jeu') { temps += dt; prochainLancer -= dt; if (prochainLancer <= 0) vague(); }
  if (comboN > 0 && performance.now() - comboT > 260) finCombo();

  for (let i = objets.length - 1; i >= 0; i--) {
    const o = objets[i];
    if (!o.vivant) { objets.splice(i, 1); continue; }
    if (o.menu) { o.obj.position.y += Math.sin(performance.now() / 600) * 0.004; o.obj.rotateOnWorldAxis(o.axe, o.vrot * dt); continue; }
    o.vel.y -= o.g * dt; o.obj.position.addScaledVector(o.vel, dt);
    o.obj.rotateOnWorldAxis(o.axe, o.vrot * dt);
    if (o.or) o.obj.traverse(m => { if (m.isMesh && m.material === matOr) matOr.emissiveIntensity = 0.45 + Math.sin(performance.now() / 120) * 0.25; });
    if (o.roche && Math.random() < 0.35 * qx()) goutte(o.obj.position.clone().add(new THREE.Vector3(rnd(-.3, .3), .3, 0)), new THREE.Vector3(rnd(-.4, .4), rnd(0.6, 1.4), 0), rnd(0.06, 0.12), new THREE.Color(0x3a3430), 1.1, -0.05);
    if (o.or && Math.random() < 0.7) goutte(o.obj.position.clone().add(new THREE.Vector3(rnd(-.4, .4), rnd(-.4, .4), 0.3)), new THREE.Vector3(rnd(-.6, .6), rnd(-.2, .8), 0), rnd(0.03, 0.06), new THREE.Color(0xffe27a).multiplyScalar(1.4), 0.6, 0.1);
    if (o.roche && Math.random() < 0.5) goutte(o.obj.position.clone().add(new THREE.Vector3(rnd(-.3, .3), .5, 0)), new THREE.Vector3(rnd(-.5, .5), rnd(1, 2.5), 0), rnd(0.03, 0.06), fumee, 0.5, 0.15);
    if (o.vel.y < 0 && o.obj.position.y < -viewH / 2 - 1.5) {
      o.vivant = false; scene.remove(o.obj);
      if (!o.roche && !o.or && !o.vanille && etat === 'jeu') { son.rate(); perdreVie(); popup('Raté !', new THREE.Vector3(o.obj.position.x, -viewH / 2 + 1.2, 0), 'aie'); }
    }
  }
  for (let i = moities.length - 1; i >= 0; i--) {
    const m = moities[i]; m.vie -= dt; m.vel.y -= 11 * dt;
    // la face coupée continue de goutter pendant la chute
    if (m.vie > 2.6 && Math.random() < 9 * dt * qx()) goutte(m.obj.position.clone().add(new THREE.Vector3(rnd(-.2, .2), -.15, 0.2)), new THREE.Vector3(rnd(-.3, .3), rnd(-1, 0), 0), rnd(0.03, 0.06), m.jus, rnd(0.5, 0.9), 1.1, Math.random() < 0.3);
    m.obj.position.addScaledVector(m.vel, dt); m.obj.rotateOnWorldAxis(m.axe, m.vrot * dt);
    if (m.vie <= 0 || m.obj.position.y < -viewH / 2 - 3) { scene.remove(m.obj); moities.splice(i, 1); }
  }
  majParticules(dt);

  if (zoom > 0) zoom = Math.max(0, zoom - vrai * 2.2);
  camera.position.z = 14 - 1.4 * Math.sin(zoom * Math.PI);
  if (tremble > 0) { tremble -= vrai; camera.position.x = rnd(-.25, .25) * tremble * 3; camera.position.y = rnd(-.25, .25) * tremble * 3; } else { camera.position.x = camera.position.y = 0; }

  renderer.render(scene, camera);
  majTaches(vrai); dessinerTaches(vrai); majVitre(vrai); dessinerTrait(vrai); dessinerFanions(performance.now() / 1000);
}

// ---------------------------------------------------------------- démarrage
addEventListener('resize', resize); resize(); majVies(); majScore(); majBoutonSon();
$('btnSon').onclick = () => {
  sonCoupe = !sonCoupe; try { localStorage.setItem('koupkoup_son', sonCoupe ? 'non' : 'oui'); } catch (e) {}
  if (maitre) maitre.gain.value = sonCoupe ? 0 : 0.7; majBoutonSon();
};
$('jouer').onclick = () => { audio(); masquerReprise(); try { localStorage.removeItem('koupkoup2_partie'); } catch (e) {} demarrer(); };
$('rejouer').onclick = () => { audio(); demarrer(); };
// touchers : ne pas laisser passer aux couches inférieures
document.querySelectorAll('.zone-interactive').forEach(element => { element.addEventListener('touchend', function(event) { event.preventDefault(); event.stopPropagation(); if (event.currentTarget.click) event.currentTarget.click(); }, { passive: false }); });

(async () => {
  const info = await (await fetch('./models/fruits.json')).json();
  catalogue = info.fruits.slice();
  const premiers = ['mangue', 'letchi', 'ananas', 'banane', 'papaye', 'fruit-de-la-passion'];
  catalogue.sort((a, b) => (premiers.indexOf(b.id) >= 0) - (premiers.indexOf(a.id) >= 0) || Math.random() - 0.5);
  let fait = 0;
  const majCharge = () => { $('charge').textContent = fait < catalogue.length ? `Chargement des fruits… ${fait}/${catalogue.length}` : ''; };
  // Seuls MAX_CHARGES fruits sont en mémoire ; les autres attendent leur tour (réserve)
  const file = catalogue.slice(0, MAX_CHARGES);
  reserve = catalogue.slice(MAX_CHARGES);
  const total = file.length;
  const majCharge2 = () => { $('charge').textContent = fait < total ? `Chargement des fruits… ${fait}/${total}` : ''; };
  async function ouvrier() {
    while (file.length) {
      const d = file.shift();
      try { prets.push(await charger(d)); } catch (e) { console.warn('fruit non chargé', d.id, e); }
      fait++; majCharge2();
      if (d.id === 'mangue' && etat === 'menu') menuMangue();
    }
  }
  majCharge2();
  await Promise.all([ouvrier(), ouvrier(), ouvrier()]);
  window.PRET = true;
  journal('koupkoup2', `modèles ${DOSSIER_MODELES} · ${prets.length} chargés · ${reserve.length} en réserve`);
  // Renouvellement : toutes les 20 s, un fruit de la réserve remplace le plus ancien
  perf.intervalle(renouveler, 4000);
})();
let reserve = [], tempsRenouvellement = 0, renouvellementEnCours = false;
async function renouveler() {
  if (renouvellementEnCours || !reserve.length || !perf.actif || contextePerdu) return;
  const maintenant = performance.now() / 1000; // (l'intervalle ne tourne pas en arrière-plan : perf.actif)
  if (maintenant - tempsRenouvellement < 20) return;
  tempsRenouvellement = maintenant;
  if (!prets.some(f => !PROTEGES.has(f.d.id) && !enVol(f))) return;
  renouvellementEnCours = true;
  const d = reserve.shift();
  try {
    const nouveau = await charger(d);
    const ancien = prets.filter(f => !PROTEGES.has(f.d.id) && !enVol(f)).sort((a, b) => a.charge - b.charge)[0];
    if (ancien) { oublier(ancien); reserve.push(ancien.d); }
    prets.push(nouveau);
  } catch (e) { console.warn('fruit non chargé', d.id, e); reserve.push(d); }
  renouvellementEnCours = false;
}
// Libération complète (appelée par le site avant de quitter le jeu, et à la fermeture de la page)
let libere = false;
function liberer() {
  if (libere) return; libere = true;
  perf.detruire();
  [...prets].forEach(oublier);
  scene.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  if (rocheMat.emissiveMap) rocheMat.emissiveMap.dispose();
  if (scene.environment) scene.environment.dispose();
  renderer.dispose(); renderer.forceContextLoss();
  [fond, taches, trace, vitre, couche, coucheVitre, fanions].forEach(libererCanvas);
  if (actx) { try { actx.close(); } catch (e) {} }
  journal('liberation', 'koup-koup-2');
}
window.kwelafeLiberer = liberer;
window.kwelafeInfo = () => ({ ...renderer.info.memory, fruits: prets.length, reserve: reserve.length, modeles: DOSSIER_MODELES, qualite: QUALITE, mode30: perf.mode30, dpr: renderer.getPixelRatio() });
addEventListener('pagehide', e => { if (!e.persisted) liberer(); });
perf.boucle(boucle);

// mode test : simuler une partie pour les captures
if (TEST) {
  window.testCoupe = (ax, ay, bx, by) => { const t = performance.now(); testerCoupe({ x: ax, y: ay, t: t - 30 }, { x: bx, y: by, t }); };
  window.jeu = { demarrer, lancer, prets, objets, cache, get etat() { return etat; }, toScreen, trait, renouveler, reserve: () => reserve, perf };
}
}
</script>
