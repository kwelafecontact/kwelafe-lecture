<style>

  .barreHaut { position:fixed; z-index:20; top:max(14px, env(safe-area-inset-top)); left:calc(max(14px, env(safe-area-inset-left)) + 88px); right:calc(max(14px, env(safe-area-inset-right)) + 54px); height:44px; display:flex; align-items:center; justify-content:center; gap:10px; color:#fff; pointer-events:none; }
  .barreHaut .nom { font-weight:800; font-size:clamp(15px, 3.8vw, 20px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 6px rgba(0,0,0,.7); }

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// ---------------------------------------------------------------- recettes (reprises de Koup Rougail v2)
// Ingrédients de Koup Rougail → aliments de la cuisine KwFX : curcuma = safran péi, oignon vert = cive.
// coupe : des (dés), emince, fin (haché fin), batonnets, rondelles (traits guides), morceaux.
// pilon : ce qu'on pile avec le gros sel (ail, gingembre, piment, thym, safran péi) ; bol : ce qu'on mélange.
const RECETTES = [
  { nom: 'Rougail saucisse', couper: { tomate: [3, 'des'], oignon: [2, 'emince'] }, piler: ['ail', 'ail', 'piment', 'sel'], bol: ['tomate', 'oignon'],
    fait: "Le rougail saucisse est considéré comme l'emblème culinaire de La Réunion : saucisses boucanées, tomates, piment, servi avec du riz." },
  { nom: 'Rougail tomate', couper: { tomate: [3, 'des'], oignon: [1, 'emince'], gingembre: [1, 'morceaux'] }, piler: ['gingembre', 'piment', 'sel'], bol: ['tomate', 'oignon'],
    fait: "Le rougail tomate est une vraie institution à La Réunion, mais aussi à Madagascar et à Maurice." },
  { nom: 'Cari poulet', couper: { oignon: [2, 'emince'], tomate: [2, 'des'], safran: [1, 'morceaux'] }, piler: ['ail', 'ail', 'safran', 'sel'], bol: ['oignon', 'tomate'], cari: true,
    fait: "Le cari est inspiré du curry indien. Dès le XIXe siècle, il devient un plat traditionnel de l'île." },
  { nom: 'Rougail mangue', couper: { mangue: [2, 'batonnets'] }, piler: ['piment', 'sel'], bol: ['mangue'],
    fait: "Le rougail ne se fait pas qu'à la tomate : on le prépare aussi avec des mangues vertes." },
  { nom: 'Rougail tomate au combava', couper: { tomate: [3, 'des'], oignon: [1, 'emince'], combava: [1, 'fin'] }, piler: ['piment', 'sel'], bol: ['tomate', 'oignon', 'combava'],
    fait: "Le zeste de combava, un agrume péi très parfumé, relève aussi les caris de poisson." },
  { nom: 'Rougail zavocat', couper: { avocat: [2, 'des'], oignon: [1, 'fin'] }, piler: ['piment', 'sel'], bol: ['avocat', 'oignon'],
    fait: "Dans le rougail zavocat, l'avocat prend la place de la tomate." },
  { nom: 'Cari poulet gingembre', couper: { oignon: [2, 'emince'], tomate: [1, 'des'], gingembre: [1, 'morceaux'], safran: [1, 'morceaux'] }, piler: ['ail', 'ail', 'gingembre', 'safran', 'sel'], bol: ['oignon', 'tomate'], cari: true,
    fait: "À La Réunion, le curcuma s'appelle « safran péi » : il parfume et colore le cari." },
  { nom: 'Achards de légumes', couper: { carotte: [1, 'batonnets'], chou: [1, 'emince'], haricot: [2, 'rondelles'], oignon: [1, 'emince'], safran: [1, 'morceaux'] }, piler: ['safran', 'piment', 'sel'], bol: ['carotte', 'chou', 'haricot', 'oignon'],
    fait: "Les achards se servent avec la viande, le poisson ou en sandwich : chou blanc, haricots verts, carottes et oignons, colorés au curcuma." },
  { nom: 'Rougail morue', couper: { tomate: [3, 'des'], oignon: [2, 'emince'] }, piler: ['ail', 'ail', 'piment', 'thym', 'sel'], bol: ['tomate', 'oignon'],
    fait: "La morue séchée, dessalée la veille, se cuisine en rougail avec la tomate, l'oignon, l'ail et une branche de thym." },
  { nom: 'Rougail citron', couper: { citron: [3, 'morceaux'], oignon: [1, 'emince'], gingembre: [1, 'morceaux'] }, piler: ['gingembre', 'piment', 'sel'], bol: ['citron', 'oignon'],
    fait: "Beaucoup de Réunionnais l'appellent tout simplement « sauce citron ». Le gingembre n'est pas obligatoire." },
  { nom: 'Rougail concombre', couper: { concombre: [1, 'des'], oignon: [1, 'fin'] }, piler: ['ail', 'piment', 'thym', 'sel'], bol: ['concombre', 'oignon'],
    fait: "Frais et croquant, le rougail concombre accompagne très bien un cari bien relevé." },
  { nom: 'Cari porc chouchou', couper: { chouchou: [2, 'morceaux'], oignon: [1, 'emince'], tomate: [2, 'des'], safran: [1, 'morceaux'] }, piler: ['ail', 'thym', 'safran', 'sel'], bol: ['chouchou', 'oignon', 'tomate'], cari: true,
    fait: "Le chouchou pousse en treille dans les Hauts, à Salazie surtout : en cari avec le porc, il fond dans la sauce." },
  { nom: "Cari ti'jacque", couper: { jacque: [1, 'morceaux'], tomate: [2, 'des'], oignon: [1, 'emince'], gingembre: [1, 'morceaux'], safran: [1, 'morceaux'] }, piler: ['ail', 'gingembre', 'safran', 'thym', 'sel'], bol: ['jacque', 'tomate', 'oignon'], cari: true,
    fait: "Le cari ti'jacque se prépare avec le jeune fruit du jacquier, souvent avec du boucané." },
  { nom: 'Rougail poisson à la cive', couper: { tomate: [3, 'des'], oignon: [1, 'emince'], cive: [1, 'fin'], gingembre: [1, 'morceaux'] }, piler: ['ail', 'gingembre', 'piment', 'sel'], bol: ['tomate', 'oignon', 'cive'],
    fait: "La cive, c'est l'oignon vert. Hachée fin, elle parfume le rougail de poisson au dernier moment." },
];
const NOMS = { tomate: ['tomate', 'tomates', 'la'], oignon: ['oignon', 'oignons', "l'"], ail: ["ail", "têtes d'ail", "l'"], piment: ['piment', 'piments', 'le'], gingembre: ['gingembre', 'gingembre', 'le'],
  safran: ['safran péi', 'safran péi', 'le'], sel: ['gros sel', 'gros sel', 'le'], thym: ['thym', 'thym', 'le'], combava: ['combava', 'combavas', 'le'], cive: ['cive', 'cives', 'la'], carotte: ['carotte', 'carottes', 'la'],
  chou: ['chou', 'choux', 'le'], haricot: ['haricot vert', 'haricots verts', "l'"], mangue: ['mangue verte', 'mangues vertes', 'la'], avocat: ['avocat', 'avocats', "l'"], citron: ['citron galet', 'citrons galets', 'le'],
  concombre: ['concombre', 'concombres', 'le'], chouchou: ['chouchou', 'chouchous', 'le'], jacque: ["ti'jacque", "ti'jacques", 'le'] };
const nom1 = (a, n) => n > 1 ? n + ' ' + NOMS[a][1] : (NOMS[a][2] === "l'" ? "l'" + NOMS[a][0] : NOMS[a][2] + ' ' + NOMS[a][0]);
const liste = arr => { const u = [...new Set(arr)].map(a => NOMS[a][0]); return u.length > 1 ? u.slice(0, -1).join(', ') + ' et ' + u[u.length - 1] : u[0]; };
// tailles sur la planche (cm), pour la mise en place
const TAILLE = { tomate: [7, 7], oignon: [7.5, 7.2], carotte: [17, 2.6], gingembre: [9, 4.5], ail: [3.2, 1.8], piment: [6.5, 1.3], combava: [4.8, 4.8], safran: [6, 1.6], cive: [20, 1.1], sel: [2.6, 2.6],
  avocat: [10, 6.6], mangue: [10, 7], chou: [12, 11.4], haricot: [12, 0.95], thym: [9, 1.4], citron: [4.6, 4.6], concombre: [18, 4.4], chouchou: [10, 7.4], jacque: [12, 9.5] };
const JUTEUX = { tomate: 0.35, citron: 0.3, concombre: 0.22, combava: 0.2, mangue: 0.15, avocat: 0.12 }; // petites giclées sur les aliments juteux
// Légumes des autres jeux du site : rendus vus du dessus des modèles 3D Blender (Koup Koup 2 et 3, Koup Rougail),
// avec leur coupe (moitié du modèle vue côté chair). Longueur sur la planche en cm.
const LONG = { tomate: 7.5, oignon: 7.5, ail: 5, piment: 7, gingembre: 9.5, safran: 7, combava: 5.2, cive: 20, carotte: 17, avocat: 11, mangue: 11,
  chou: 13, haricot: 12, thym: 10, citron: 4.8, concombre: 18, chouchou: 11, jacque: 13 };
const NOM_ALIM = { ail: 'Ail', safran: 'Safran péi', jacque: "Ti'jacque", haricot: 'Haricot vert', citron: 'Citron galet', mangue: 'Mangue verte', chou: 'Chou blanc' };
let LEGUMES = null; // aliments en image, prêts pour la cuisine KwFX
const legumesPrets = fetch('legumes/legumes.json').then(r => r.json()).then(J => {
  LEGUMES = {};
  Object.entries(J).forEach(([k, v]) => {
    const img = new Image(), imgCoupe = new Image(); img.src = 'legumes/' + k + '.webp'; imgCoupe.src = 'legumes/' + k + '-coupe.webp';
    const l = LONG[k] || 8, a = { img, imgCoupe, contour: v.contour, l, h: +(l * v.ratio).toFixed(2), peau: v.peau, peau2: v.peau, chair: v.chair };
    if (NOM_ALIM[k]) a.nom = NOM_ALIM[k];
    LEGUMES[k] = a; TAILLE[k] = [l, a.h];
  });
}).catch(() => { LEGUMES = {}; });
const RONDS = new Set(['tomate', 'oignon', 'combava', 'citron', 'chou', 'jacque']);
const COUPES = {
  des: { k: 8, txt: (a, n) => `Coupe ${nom1(a, n)} en dés (au moins ${n * 8} morceaux).`, ok: (r, n) => r.morceaux >= n * 8 && r.tailleMoyenne < 6 },
  emince: { k: 5, txt: (a, n) => `Émince ${nom1(a, n)} en fines lamelles (au moins ${n * 5}).`, ok: (r, n) => r.morceaux >= n * 5 && (r.classe === 'émincé' || r.tailleMoyenne < 4.5) },
  fin: { k: 8, txt: (a, n) => `Hache ${nom1(a, n)} bien fin (au moins ${n * 8} morceaux).`, ok: (r, n) => r.morceaux >= n * 8, guides: 1 },
  batonnets: { k: 6, txt: (a, n) => `Taille ${nom1(a, n)} en bâtonnets (au moins ${n * 6}).`, ok: (r, n) => r.morceaux >= n * 6 },
  rondelles: { k: 5, txt: (a, n) => `Coupe ${nom1(a, n)} en tronçons : suis les traits blancs.`, ok: (r, n) => r.morceaux >= n * 5, guides: 1.5 },
  morceaux: { k: 4, txt: (a, n) => `Coupe ${nom1(a, n)} en morceaux (au moins ${n * 4}).`, ok: (r, n) => r.morceaux >= n * 4 },
};
const nbDe = (R, a) => (R.couper[a] ? R.couper[a][0] : 0) || R.piler.filter(x => x === a).length || 1;

// mise en place sur la planche (40 × 26 cm) : rangées, du plus haut au plus petit
function miseEnPlace(R) {
  const items = [];
  const tous = new Set([...Object.keys(R.couper), ...R.piler]);
  tous.forEach(a => { for (let i = 0; i < nbDe(R, a); i++) items.push(a); });
  items.sort((p, q) => TAILLE[q][1] - TAILLE[p][1] || TAILLE[q][0] - TAILLE[p][0]);
  const poser = []; let x = 1, y = 1, hRang = 0, rang = 0;
  items.forEach(a => {
    const [l, h] = TAILLE[a];
    if (x + l > 39) { x = 1; y += hRang + 1.2; hRang = 0; rang++; }
    poser.push([a, x + l / 2, y + h / 2, RONDS.has(a) ? Math.random() * 6.28 : (Math.random() - 0.5) * 0.25, rang]);
    x += l + 1.1; hRang = Math.max(hRang, h);
  });
  // répartit la place qui reste entre les rangées (la bulle de consigne occupe le haut)
  const reste = Math.max(0, 25 - (y + hRang)), pas = reste / (rang + 2);
  return poser.map(q => [q[0], q[1], Math.min(25.5, q[2] + pas * (q[4] + 1.3)), q[3]]);
}

// recette du jeu → recette KwFX (étapes vérifiées sur la vraie découpe)
function versKwfx(R, grand) {
  const etapes = [];
  Object.entries(R.couper).forEach(([a, [n, c]]) => {
    const C = COUPES[c];
    etapes.push({ type: 'couper', al: a, texte: C.txt(a, n), avant: C.guides ? () => cu.guides(a, { ecart: C.guides }) : null,
      verif: r => { const p = r.parAliment[a]; return !!p && C.ok(p, n); } });
  });
  const pil = [...new Set(R.piler)];
  etapes.push({ type: 'pilon', als: pil, texte: `Mets ${liste(pil)} dans le pilon, puis pile jusqu'à une pâte.`,
    verif: r => { const d = r.pilon.detail.map(q => q.aliment); return pil.every(a => d.includes(a)) && r.pilon.code >= 3; } });
  etapes.push({ type: 'bol', als: R.bol, texte: `Mets ${liste(R.bol)} dans le bol${R.cari ? ' (pour la marmite)' : ''}, puis mélange en tournant dedans.`,
    verif: (r, api) => { const m = api.morceaux(); return R.bol.every(a => m.some(p => p.aliment === a && p.zone === 'bol') && !m.some(p => p.aliment === a && p.zone === 'planche')) && r.bol.melange >= (R.cari ? 55 : 70); } });
  return {
    nom: R.nom, titre: R.nom, garde: [...new Set([...Object.keys(R.couper), ...R.piler])], poser: miseEnPlace(R), etapes,
    info: 'Trace un trait pour couper. Appuie longtemps sur un morceau pour le saisir. Tape dans le pilon pour écraser, tourne dedans pour affiner. Tourne dans le bol pour mélanger.',
    score: r => qualite(R, r), fin: q => q >= 88 ? `${R.nom} bien coupé, bien pilé : bravo ! (${q} %)` : `${R.nom} prêt (${q} %). Des coupes plus régulières le rendront encore plus beau.`
  };
}
function qualite(R, r) {
  let reg = [], s = 55;
  Object.entries(R.couper).forEach(([a, [n, c]]) => { const p = r.parAliment[a]; if (p && p.morceaux > 1 && !R.piler.includes(a)) reg.push(p.regularite); });
  if (reg.length) s += Math.min(20, reg.reduce((x, y) => x + y, 0) / reg.length / 5);
  s += r.precision != null ? r.precision / 10 : 7;
  s += r.bol.melange >= 85 ? 8 : r.bol.melange >= 70 ? 5 : 2;
  s += r.pilon.code >= 4 ? 10 : r.pilon.code >= 3 ? 6 : 0;
  return Math.max(0, Math.min(100, s));
}

// ---------------------------------------------------------------- KwFX
const S = { son: ls.get('kpil_son', true), carnet: ls.get('kpil_carnet', {}), record: ls.get('kpil_record', 0) };
let modeJeu = 'trankil';
const fx = window.KwFX ? KwFX.init({
  theme: 'fruits', public: 'enfant', manga: 1, mode: 'trankil', support: 'web', jeu: 'koup-pilon',
  reduireAnimations: false, secousses: true, complement: true, // la cuisine dessine déjà son jus et ses miettes : KwFX ajoute séries, pépites, messages
  sons: S.son, sonsPack: '../commun/kwfx-sons/', sonsEvenements: ['combo', 'pepite', 'niveau', 'victoire', 'debut', 'clic', 'presque', 'bonne'], // le son de coupe et de pilon vient de la cuisine
  messages: true, messagesTypes: ['serie', 'record', 'victoire', 'encourage', 'niveau', 'pepite', 'debut'], echelleMessages: 0.5, hautMessages: '42%',
  cibleScore: $('score'), dprMax: 2
}) : null;
let cu = null, R = null, partie = null, t0 = 0, minuteur = 0, serieFine = 0;
function majSon() { $('btnSon').textContent = S.son ? '🔊' : '🔇'; if (fx) fx.opt.sons = S.son; if (musique.g) musique.g.gain.value = S.son ? 0.2 : 0; }
$('btnSon').addEventListener('click', () => { S.son = !S.son; ls.set('kpil_son', S.son); majSon(); });

// musique d'ambiance (instrumentales ElevenLabs de Koup Rougail v2), en Web Audio pour régler le volume sur iPhone
const musique = { ctx: null, g: null, src: null, buf: {} };
function jouerMusique(nom) {
  try {
    if (!musique.ctx) { musique.ctx = new (window.AudioContext || window.webkitAudioContext)(); musique.g = musique.ctx.createGain(); musique.g.connect(musique.ctx.destination); }
    musique.ctx.resume && musique.ctx.resume(); musique.g.gain.value = S.son ? 0.2 : 0;
    const go = b => { if (musique.src) { try { musique.src.stop(); } catch (e) {} } const s = musique.ctx.createBufferSource(); s.buffer = b; s.loop = true; s.connect(musique.g); s.start(); musique.src = s; };
    if (musique.buf[nom]) return go(musique.buf[nom]);
    fetch('../koup-rougail-v2/sons/musique-' + nom + '.mp3').then(r => r.arrayBuffer()).then(a => new Promise((ok, ko) => musique.ctx.decodeAudioData(a, ok, ko))).then(b => { musique.buf[nom] = b; go(b); }).catch(() => {});
  } catch (e) {}
}

// ---------------------------------------------------------------- écrans
function montrer(id) { ['accueil', 'carnet'].forEach(e => $(e).classList.toggle('cache', e !== id)); const enJeu = id === 'jeu'; $('jeu').classList.toggle('cache', !enJeu); $('barreHaut').classList.toggle('cache', !enJeu); $('barreHaut').style.display = enJeu ? '' : 'none'; }
function majDefi() { if (fx) { const d = fx.defiDuJour(); $('defi').innerHTML = '<b>Défi du jour :</b> ' + d.texte + (d.reussi ? ' ✓' : ''); } }
const etoilesDe = q => q >= 88 ? 3 : q >= 72 ? 2 : 1;
function carnet() {
  const n = Object.keys(S.carnet).length;
  $('carnetInfo').textContent = n ? `Recettes réussies : ${n} / ${RECETTES.length}. Vise les 3 étoiles !` : 'Choisis une recette. Chaque plat réussi entre dans ton carnet avec ses étoiles.';
  $('grille').innerHTML = '';
  RECETTES.forEach((r, i) => {
    const b = document.createElement('button'); b.className = 'carte zone-interactive' + (Object.keys(r.couper).length >= 5 ? ' grand' : ''); const e = S.carnet[r.nom] || 0;
    b.innerHTML = `<b>${r.nom}</b><span class="ing">${liste([...Object.keys(r.couper), ...r.piler.filter(a => a !== 'sel')])}</span><span class="et ${e ? '' : 'vide'}">${'★'.repeat(e)}${'☆'.repeat(3 - e)}</span>`;
    b.addEventListener('click', () => lancerRecette(i)); $('grille').appendChild(b);
  });
  montrer('carnet');
}
$('bTrankil').addEventListener('click', () => { modeJeu = 'trankil'; if (fx) fx.opt.mode = 'trankil'; jouerMusique('calme'); carnet(); });
$('bProbleme').addEventListener('click', () => {
  modeJeu = 'probleme'; if (fx) fx.opt.mode = 'probleme'; jouerMusique('intense');
  const ordre = RECETTES.map((r, i) => i).sort(() => Math.random() - 0.5).slice(0, 3);
  partie = { ordre, n: 0, score: 0 }; if (fx) fx.evenement('debut');
  lancerRecette(ordre[0]);
});
$('bHasard').addEventListener('click', () => lancerRecette(Math.floor(Math.random() * RECETTES.length)));

// ---------------------------------------------------------------- partie
function creerCuisine() {
  if (cu) return;
  const portrait = innerHeight > innerWidth;
  cu = fx.cuisine($('zone'), { aliments: LEGUMES || {}, hauteur: portrait ? 'max(420px, min(calc(100dvh - 150px), calc((100vw - 20px) * 1.08 + 90px)))' : 'max(420px, min(calc(100dvh - 130px), 640px))' });
  // boutons du jeu ajoutés à la barre d'outils de la cuisine
  const barre = $('zone').querySelector('.kwfx-cuisine').children[1];
  const bt = (txt, f, cls) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'zone-interactive ' + (cls || ''); b.textContent = txt; b.style.cssText = 'min-height:44px;padding:8px 14px;border-radius:12px;border:0;font:800 14px system-ui,sans-serif;cursor:pointer;background:#7a5a3a;color:#fff8ee'; b.addEventListener('click', f); barre.appendChild(b); return b; };
  cu.bAction = bt('', action, 'action'); cu.bAction.style.display = 'none';
  bt('↺ Recommencer', () => lancerRecette(R.idx, true));
  bt('Carnet', () => { if (modeJeu === 'probleme') { finService(true); } else { arreterChrono(); carnet(); } });
  cu.sur('coupe', d => {
    if (!fx) return; const r = $('zone').querySelector('.kwfx-cuisine canvas').getBoundingClientRect();
    const x = r.left + d.x, y = r.top + d.y, dec = fx.evenement('coupe', { x, y, couleur: d.couleur });
    if (JUTEUX[d.aliment]) fx.joue('jus', { x, y, couleur: d.couleur, intensite: JUTEUX[d.aliment] });
    if (modeJeu === 'probleme' && partie) { const g = Math.min(Math.round(5 * dec.multiplicateur * d.morceaux), 300 - partie.coupes); if (g > 0) { partie.coupes += g; partie.score += g; majScore(); } } // 300 points de coupe au plus par plat : hacher à l'infini ne rapporte rien
  });
  cu.sur('precision', d => { if (d.precision > 85) { serieFine++; if (modeJeu === 'probleme' && partie) { partie.score += 10 * Math.min(5, serieFine); majScore(); } } else serieFine = 0; });
  cu.sur('pose', d => {
    if (!R || !d.piece) return; const a = d.piece.al;
    if (d.zone === 'mortier' && !R.piler.includes(a)) { cu.dire(`Pour ce plat, ${NOMS[a] ? NOMS[a][0] : a} ne va pas au pilon. Pas grave : « Recommencer » remet tout en place.`, 'doux', 4200); if (fx) fx.evenement('presque', {}); }
    majAction();
  });
  cu.sur('texture', () => majAction());
  cu.sur('fini', d => finRecette(d));
}
function etapeCourante() { const e = cu && cu.etat(); return e && R ? R.k.etapes[e.etape] : null; }
function majAction() {
  if (!cu) return; const e = etapeCourante(), b = cu.bAction;
  if (!e || (e.type !== 'pilon' && e.type !== 'bol')) { b.style.display = 'none'; return; }
  const m = cu.morceaux(), zone = e.type === 'pilon' ? 'mortier' : 'bol';
  const reste = m.filter(p => e.als.includes(p.aliment) && p.zone !== zone).length;
  b.style.display = reste ? '' : 'none'; b.textContent = e.type === 'pilon' ? '⬇ Mettre dans le pilon' : '⬇ Racler la planche dans le bol';
  b.classList.toggle('attention', !!reste);
}
function action() {
  const e = etapeCourante(); if (!e) return;
  const zone = e.type === 'pilon' ? 'mortier' : 'bol';
  e.als.forEach(a => cu.tout(a, zone));
  if (fx) fx.evenement('clic', {});
  cu.dire(e.type === 'pilon' ? 'Tape dans le pilon pour écraser, puis tourne dedans pour affiner.' : 'Tourne dans le bol avec le doigt pour mélanger.', null, 3500);
  majAction();
}
function lancerRecette(i, recommencer) {
  $('fiche').classList.add('cache');
  if (!fx) return;
  if (!LEGUMES) { legumesPrets.then(() => lancerRecette(i, recommencer)); return; }
  montrer('jeu'); creerCuisine();
  R = RECETTES[i]; R.idx = i; R.k = versKwfx(R); if (partie) partie.coupes = 0;
  cu.recette(R.k); serieFine = 0;
  $('nomRecette').textContent = (modeJeu === 'probleme' && partie ? `Plat ${partie.n + 1}/3 · ` : '') + R.nom;
  montrer('jeu'); $('jeu').scrollTop = 0; majAction(); majScore();
  arreterChrono(); t0 = performance.now();
  if (modeJeu === 'probleme') { minuteur = setInterval(majChrono, 250); majChrono(); } else $('chrono').textContent = '';
  if (!recommencer && fx && modeJeu === 'trankil') fx.evenement('debut');
  clearInterval(lancerRecette.suivi); lancerRecette.suivi = setInterval(majAction, 700);
}
const cible = () => 60 + R.k.etapes.length * 22; // secondes : au-delà, juste moins de bonus, jamais d'échec
function majChrono() { const t = (performance.now() - t0) / 1000, c = cible(); $('chrono').textContent = '⏱ ' + Math.floor(t) + ' s' + (t < c ? '' : ''); $('chrono').style.color = t < c ? '#bfe8ff' : '#ffd7a8'; }
function arreterChrono() { clearInterval(minuteur); minuteur = 0; }
function majScore() { $('score').textContent = modeJeu === 'probleme' && partie ? '★ ' + partie.score : ''; }

function finRecette(d) {
  arreterChrono(); clearInterval(lancerRecette.suivi); cu.bAction.style.display = 'none';
  const q = d.qualite, et = etoilesDe(q), t = (performance.now() - t0) / 1000, res = d.resultat;
  const avant = S.carnet[R.nom] || 0; if (et > avant) { S.carnet[R.nom] = et; ls.set('kpil_carnet', S.carnet); }
  let pts = 0, bonus = 0;
  if (modeJeu === 'probleme' && partie) { bonus = Math.max(0, Math.round((cible() - t) * 3)); pts = q * 10 + bonus; partie.score += pts; partie.n++; majScore(); }
  const det = Object.values(res.parAliment).filter(p => p.morceaux > 1).map(p => `${p.nom} : ${p.morceaux} morceaux, ${p.classe}, régularité ${p.regularite} %`).concat(['Pilon : ' + res.pilon.nom, 'Bol : mélangé à ' + res.bol.melange + ' %']);
  if (res.precision != null) det.push('Précision sur les traits : ' + res.precision + ' %');
  const dernier = modeJeu === 'probleme' && partie && partie.n >= 3;
  setTimeout(() => {
    $('ficheIn').innerHTML = `<div class="plat">${R.nom}</div><div class="etoiles">${'★'.repeat(et)}<span class="off">${'★'.repeat(3 - et)}</span></div>
      <div class="qualite">Qualité ${q} %${et > avant && avant ? ' · nouvelle étoile !' : !avant ? ' · nouveau dans le carnet !' : ''}</div>
      ${modeJeu === 'probleme' ? `<div class="pts">+${pts}</div><div class="det">${q * 10} pour la qualité${bonus ? ' + ' + bonus + ' de rapidité' : ''} · ${Math.round(t)} s</div>` : ''}
      <div class="det">${det.join('<br>')}</div>
      <div class="fait"><b>Le savais-tu ?</b> ${R.fait}</div>
      <div class="bts" id="ficheBts"></div>`;
    const bts = $('ficheBts'), bt = (txt, f, sec) => { const b = document.createElement('button'); b.className = 'btn zone-interactive' + (sec ? ' sec' : ''); b.textContent = txt; b.addEventListener('click', f); bts.appendChild(b); };
    if (modeJeu === 'probleme') { if (dernier) bt('Voir mon score', () => finService()); else bt('Plat suivant', () => lancerRecette(partie.ordre[partie.n])); }
    else { bt('Recette suivante', () => lancerRecette((R.idx + 1) % RECETTES.length)); bt('Carnet', () => { $('fiche').classList.add('cache'); carnet(); }, true); if (et < 3) bt('Rejouer pour 3 ★', () => lancerRecette(R.idx, true), true); }
    $('fiche').classList.remove('cache');
  }, 1700);
}
function finService(abandon) {
  arreterChrono(); clearInterval(lancerRecette.suivi);
  const sc = partie ? partie.score : 0, n = partie ? partie.n : 0; partie = null;
  let rec = false; if (!abandon && sc > S.record) { S.record = sc; ls.set('kpil_record', sc); rec = true; }
  if (fx && !abandon) fx.finPartie(sc);
  $('ficheIn').innerHTML = `<div class="plat">${abandon ? 'Service interrompu' : 'Service terminé !'}</div><div class="gros" style="color:#c2580a;text-shadow:none">${sc}</div>
    <div class="qualite">${rec ? 'Nouveau record !' : 'Record : ' + S.record}</div><div class="det">${n} plat${n > 1 ? 's' : ''} servi${n > 1 ? 's' : ''}</div><div class="bts" id="ficheBts"></div>`;
  const bts = $('ficheBts'), bt = (txt, f, sec) => { const b = document.createElement('button'); b.className = 'btn zone-interactive' + (sec ? ' sec' : ''); b.textContent = txt; b.addEventListener('click', f); bts.appendChild(b); };
  bt('Nouveau service', () => $('bProbleme').click()); bt('Accueil', () => { $('fiche').classList.add('cache'); majDefi(); montrer('accueil'); }, true);
  $('fiche').classList.remove('cache');
}

// libération quand on quitte la page (le cadre du site appelle kwelafeLiberer)
window.kwelafeLiberer = function () { try { arreterChrono(); clearInterval(lancerRecette.suivi); if (cu) cu.arreter(); if (fx) fx.detruire(); if (musique.ctx) musique.ctx.close(); } catch (e) {} };
document.addEventListener('visibilitychange', () => { if (!musique.ctx) return; if (document.hidden) musique.ctx.suspend(); else musique.ctx.resume(); });

majSon(); majDefi(); montrer('accueil');
window.__kp = { RECETTES, versKwfx, get cu() { return cu; }, get fx() { return fx; }, lancerRecette };
})();
</script>
